name: Android release security build (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/build-android-web.mjs'
      - 'scripts/harden-android.mjs'
      - 'scripts/verify-android-release.py'
      - 'tests/android_hardening.test.cjs'
      - '.github/workflows/android-cloud-build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: npm run android:init
      - name: Build unsigned release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify packaged security controls
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/yourstaff-release-manifest.xml
          python3 scripts/verify-android-release.py /tmp/yourstaff-release-manifest.xml
      - name: Upload unsigned release APK (NOT install-ready)
        uses: actions/upload-artifact@v4
        with:
          name: your-staff-unsigned-release-apk-not-for-install
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned AAB (NOT Play-ready)
        uses: actions/upload-artifact@v4
        with:
          name: your-staff-unsigned-aab-not-for-play
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
