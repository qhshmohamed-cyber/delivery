  if (isOwner()) { await ownerBranchPicker(); return; }
  const permitted = Array.isArray(me.allowed_branch_ids) && me.allowed_branch_ids.length ? me.allowed_branch_ids : [me.branch_id];

async function refreshKitchenDelayNotices() {

  const rows = (data || []).filter(n => !n.read_at && (n.notification_type === 'kitchen_delay' || !n.notification_type));

async function runKitchenDelayCheck() {

/* ---------- العمليات ---------- */
async function safeRpc(name, args) {
  try {
    const result = await sb.rpc(name, args);
    return result || { data: null, error: { message: 'لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة.' } };
  } catch (err) {
    const message = err && err.message ? err.message : 'تعذر الاتصال بالخادم. لم يتم تأكيد حفظ العملية.';
    return { data: null, error: { message } };
  }
}
function requireOnline(action='تنفيذ العملية') {
  if (navigator.onLine) return true;
  flash(`لا يمكن ${action} بدون اتصال بالإنترنت. لم يتم حفظ أي تغيير؛ أعد المحاولة بعد عودة الاتصال.`, false);
  return false;
}
async function setStatus(id, to, note) {
  if (!requireOnline('تغيير حالة الطلب')) return;
  const {error} = await safeRpc('dlv_set_status', {p_id: id, p_to: to, p_note: note || null});
  if (error) return flash(error.message, false);
  flash('تم التحديث', true);
  refreshView();
}
function newOrderForm() {
  const wf = me?.workflow_role || me?.role;
  if (!me || !['callcenter_followup','manager','admin'].includes(wf)) return flash('إنشاء الطلب متاح لمتابعة الكول سنتر والإدارة فقط', false);
  const isMgr = true;
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div><h2 style="font-size:16px">طلب جديد</h2><div id="ferr" class="msg e hide"></div>
    <label>رقم الطلب *</label><input id="n_no" inputmode="numeric">
    ${(isOwner() || (me.allowed_branch_ids||[]).length>1) ? `<label>الفرع *</label><select id="n_branch">${Object.entries(branchNames).map(([id,name])=>`<option value="${id}" ${Number(selectedBranch)===Number(id)?'selected':''}>${esc(name)}</option>`).join('')}</select>` : ''}
    ${isMgr ? `<label>اسم العميل</label><input id="n_c"><label>رقم الهاتف</label><input id="n_p" inputmode="tel">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="n_wa_consent" style="width:auto"> العميل وافق على استلام رابط المتابعة عبر واتساب</label>
    <label>العنوان</label><input id="n_a">` : ''}
    ${isMgr ? '<label>ملاحظات</label><textarea id="n_n" rows="2"></textarea>' : ''}
    <div class="row" style="margin-top:14px"><button class="p big" id="n_ok" style="flex:1">تسجيل</button><button class="big" id="n_x" style="flex:0 0 90px">إلغاء</button></div></div>`;
  document.body.appendChild(d);
  $('n_x').onclick = () => d.remove();
  $('n_ok').onclick = async () => {
    if (!requireOnline('إنشاء الطلب')) return;
    $('n_ok').disabled = true;
    const {data: createdId, error} = await safeRpc('dlv_create_order', {p_order_no: $('n_no').value, p_customer: isMgr ? $('n_c').value : null, p_phone: isMgr ? $('n_p').value : null,
      p_address: isMgr ? $('n_a').value : null, p_notes: isMgr ? $('n_n').value : null, p_driver: null, p_branch_id: (isOwner() || (me.allowed_branch_ids||[]).length>1) ? Number($('n_branch').value) : null});
    if (error) { $('n_ok').disabled = false; const e = $('ferr'); e.textContent = error.message; e.className = 'msg e'; return; }
    let codeText = '';
    if (createdId) {
      const {data: createdOrder} = await sb.from('dlv_orders').select('track_code').eq('id', createdId).maybeSingle();
      if (createdOrder && createdOrder.track_code) codeText = ' — كود متابعة العميل: ' + createdOrder.track_code;
    }
    const consent = $('n_wa_consent')?.checked === true;
    const customerPhone = String($('n_p')?.value||'').replace(/\D/g,'');
    const normalizedPhone = customerPhone.startsWith('0') ? '20'+customerPhone.slice(1) : customerPhone;
    // Until a verified WhatsApp Business sender is configured, never claim automatic delivery.
    const trackingCode = codeText.match(/[A-HJ-NP-Z2-9]{8}/)?.[0] || '';
    refreshView();
    if (consent && /^20(?:10|11|12|15)\d{8}$/.test(normalizedPhone) && trackingCode) {
      const link = location.origin+location.pathname+'?t='+encodeURIComponent(trackingCode);
      const msg = 'واحة اليمن — تم تسجيل طلبك رقم '+$('n_no').value+'. تابع طلبك من هنا: '+link;
      const waLink = 'https://wa.me/'+normalizedPhone+'?text='+encodeURIComponent(msg);
      const go = document.createElement('a');go.href=waLink;go.target='_blank';go.rel='noopener noreferrer';go.textContent='فتح واتساب لإرسال رابط المتابعة';
      go.style.cssText='display:block;padding:12px;background:#fff8ea;color:#5a3317;border:1px solid #b9832e;border-radius:10px;margin:12px 0;text-align:center';
      d.remove();const panel=document.createElement('div');panel.className='card';panel.append('تم حفظ الطلب. لم يتم إرسال واتساب تلقائيًا. اضغط لإرسال الرسالة من واتساب: ',go);$('app')?.prepend(panel);
    } else { d.remove(); }
    flash('تم تسجيل الطلب' + codeText, true);
  };
}
function failDialog(id) {
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div><h2 style="font-size:16px">سبب تعذر التوصيل</h2><select id="fr">${REASONS.map(r => `<option>${r}</option>`).join('')}</select>
    <div class="row" style="margin-top:14px"><button class="r big" id="fr_ok" style="flex:1">تأكيد</button><button class="big" id="fr_x" style="flex:0 0 90px">رجوع</button></div></div>`;
  document.body.appendChild(d);
  $('fr_x').onclick = () => d.remove();
  $('fr_ok').onclick = () => { const r = $('fr').value; d.remove(); setStatus(id, 'failed', r); };
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = +b.dataset.id, a = b.dataset.act;
  if (a === 'failed') failDialog(id); else if (a === 'edit') editOrderForm(id); else if (a === 'note') noteForm(id); else if (a === 'assign') assignOrder(id); else if (a === 'srecv') supervisorReceive(id); else if (a === 'cpmsg') copyMsg(id); else if (a === 'wa') waMsg(id); else if (a === 'kfwd') kitchenForward(id); else setStatus(id, a);
});

async function loadMine() {
  const {data, error} = await branchQuery(sb.from('dlv_orders').select('*')).eq('driver_id', me.user_id).in('status', ['new','received','out']).order('created_at', {ascending:false}).limit(100);
  if (error) return flash(error.message, false);
  const o = data || []; o.forEach(x => ORD[x.id] = x);
  $('s1').textContent = o.length;
  $('s2').textContent = o.filter(x => x.status === 'out').length;
  const todayStart = new Date(cairoDate() + 'T00:00:00+02:00').toISOString();
  const {count: deliveredTodayCount, error: deliveredError} = await branchQuery(sb.from('dlv_orders').select('id',{count:'exact',head:true})).eq('driver_id',me.user_id).eq('status','delivered').gte('delivered_at',todayStart);
  $('s3').textContent = deliveredError ? '—' : (deliveredTodayCount ?? 0);
  $('ol').innerHTML = o.map(x => {
    const s = ST[x.status];
    const acts = x.status === 'new' ? `<button class="p" data-act="received" data-id="${x.id}">استلام الطلب</button>`
      : x.status === 'received' ? `<button class="p" data-act="out" data-id="${x.id}">خرج للتوصيل</button><button data-act="note" data-id="${x.id}">📝 ملاحظة</button>`
      : x.status === 'out' ? `<button class="p" data-act="delivered" data-id="${x.id}">تم التوصيل</button><button class="r" data-act="failed" data-id="${x.id}">تعذر التوصيل</button><button data-act="note" data-id="${x.id}">📝 ملاحظة</button>` : '';
    return `<div class="card"><div class="ord"><b style="font-size:18px">#${esc(x.order_no)}</b><span class="badge" style="background:${s[1]}">${s[0]}</span></div>
      <div class="meta">${esc(x.customer_name || '')} ${x.phone ? '· <a href="tel:' + esc(x.phone) + '">' + esc(x.phone) + '</a>' : ''}<br>${esc(x.address || (x.customer_name || x.phone ? '' : 'بيانات العميل لم تُضف بعد'))}<br>
      استلام ${tm(x.received_at)} · خروج ${tm(x.out_at)} · تسليم ${tm(x.delivered_at)}
      ${x.failed_reason ? '<br>السبب: ' + esc(x.failed_reason) : ''}${x.driver_note ? '<br>📝 ' + esc(x.driver_note) : ''} ${isLate(x) ? '<br><span class="late">⚠ متأخر</span>' : ''}</div>
      ${acts ? '<div class="acts">' + acts + '</div>' : ''}</div>`;
  }).join('') || '<div class="meta">لا توجد طلبات نشطة حاليًا</div>';
}

function paintComplaintsInbox(){
 const box=$('complaintsRows');if(!box)return;
 const q=($('complaintsSearch')?.value||'').trim().toLowerCase(),status=$('complaintsFilter')?.value||'';
 const rows=complaintsInboxRows.filter(x=>(!status||x.status===status)&&(!q||[x.customer_phone,x.order_no,x.title,String(x.id)].some(v=>String(v||'').toLowerCase().includes(q))));

 box.innerHTML=rows.map(x=>'<section class="card"><div class="ord"><b>شكوى #'+x.id+' · طلب #'+esc(x.order_no||'غير محدد')+'</b><span class="badge">'+esc(x.status)+'</span></div><div class="meta">التاريخ: '+new Date(x.created_at).toLocaleString('ar-EG')+' · '+esc(branchTitle(x.branch_id))+'</div><div class="meta">رقم العميل: <b dir="ltr">'+esc(x.customer_phone||'غير مسجل')+'</b></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.details||'')+'</p><div class="meta">آخر إجراء: '+esc(x.followup_action||'لم يسجل إجراء بعد')+'</div><div class="meta">بواسطة: '+esc(x.followup_employee||'—')+' · '+(x.followup_at?new Date(x.followup_at).toLocaleString('ar-EG'):'—')+'</div><button data-complaint="'+x.id+'">تسجيل إجراء متابعة</button></section>').join('')||'<div class="card">لا توجد شكاوى مطابقة</div>';
 box.querySelectorAll('[data-complaint]').forEach(b=>b.onclick=async()=>{
  const x=complaintsInboxRows.find(v=>String(v.id)===b.dataset.complaint);if(!x)return;
  const action=prompt('ما الإجراء الذي تم اتخاذه مع العميل؟');if(action===null)return;
  if(action.trim().length<3)return flash('اكتب الإجراء بالتفصيل',false);

  if(error){b.disabled=false;return flash(error.message,false);}
  flash('تم حفظ الإجراء وإتاحته للإدارة',true);loadComplaintsInbox();
 });

let managerBoardTimer = null, managerClockTimer = null, managerBoardBusy = false;
async function loadManagerOpsPending() {

function startManagerBoardRefresh(){
  clearInterval(managerBoardTimer); clearInterval(managerClockTimer);
  managerBoardTimer=setInterval(async()=>{
    if(!canViewManagerBoard() || document.visibilityState!=='visible' || managerBoardBusy) return;
    managerBoardBusy=true;
    try {
      await Promise.allSettled([loadManagerLiveKpis(),loadManagerOpsPending(),loadManagerDelayed(),refreshKitchenDelayNotices()]);
      const u=$('managerUpdatedAt'); if(u) u.textContent='آخر تحديث للبيانات: '+tm(new Date().toISOString());

  },15000);
}

async function loadAll() {

  const q = $('f_q').value.replace(/[,()%*]/g, ' ').trim();

    .order('created_at', {ascending:false}).range(page * PAGE, page * PAGE + PAGE - 1);
  if (st) qb = qb.eq('status', st); if (dr) qb = qb.eq('driver_id', dr);
  if (q) qb = qb.or(`order_no.ilike.%${q}%,customer_name.ilike.%${q}%,phone.ilike.%${q}%`);
  const [o, s] = await Promise.all([qb, safeRpc('dlv_stats', {p_from: from, p_to: to, p_branch_id: selectedBranch})]);
  if (o.error) return flash(o.error.message, false);
  (o.data || []).forEach(x => ORD[x.id] = x);

  const avgs = rows.filter(r => r.avg_min != null);
  const avg = avgs.length ? Math.round(avgs.reduce((a, r) => a + Number(r.avg_min) * Number(r.delivered), 0) / Math.max(1, avgs.reduce((a, r) => a + Number(r.delivered), 0))) : '—';
  $('kpi').innerHTML = [['إجمالي الطلبات', sum('total')], ['خرجت للتوصيل', sum('out_now')], ['تم توصيلها', sum('delivered')],
    ['متأخرة', sum('late')], ['تعذر توصيلها', sum('failed')], ['متوسط التوصيل (د)', avg]]
    .map(k => `<div class="stat"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  $('perf').innerHTML = `<table><tr><th>الدليفري</th><th>الإجمالي</th><th>تم</th><th>جاري</th><th>متأخر</th><th>تعذر</th><th>متوسط (د)</th></tr>` +
    (rows.map(r => `<tr><td>${esc(r.driver_name)}</td><td>${r.total}</td><td>${r.delivered}</td><td>${r.out_now}</td><td>${r.late}</td><td>${r.failed}</td><td>${r.avg_min ?? '—'}</td></tr>`).join('') || '<tr><td colspan="7">لا بيانات</td></tr>') + '</table>';
  $('tbl').innerHTML = `<table><tr><th>الطلب</th><th>العميل</th><th>الدليفري</th><th>جاهز (مطبخ)</th><th>استلام المشرف</th><th>تحويل للطيار</th><th>استلام الطيار</th><th>خروج</th><th>تسليم</th><th>المدة</th><th>الحالة</th><th>ملاحظة الطيار</th><th>كود العميل</th><th></th></tr>` +
    ((o.data || []).map(x => {
      const s2 = ST[x.status], d = mins(x.out_at, x.delivered_at);
      const cancel = ['new','received'].includes(x.status) ? `<button class="r" data-act="cancelled" data-id="${x.id}">إلغاء</button>` : '';
      return `<tr><td><b>#${esc(x.order_no)}</b></td><td>${esc(x.customer_name || '')}</td><td>${esc(x.driver?.full_name || '')}</td><td>${tm(x.kitchen_ready_at)}</td><td>${tm(x.supervisor_received_at)}</td><td>${tm(x.pilot_assigned_at)}</td><td>${tm(x.received_at)}</td><td>${tm(x.out_at)}</td><td>${tm(x.delivered_at)}</td><td>${d != null ? d + ' د' : '—'}</td>
        <td><span class="badge" style="background:${s2[1]}">${s2[0]}</span> ${isLate(x) ? '<span class="late">⚠</span>' : ''}${x.failed_reason ? '<div class="meta" style="white-space:normal;min-width:130px">⛔ ' + esc(x.failed_reason) + '</div>' : ''}</td><td style="white-space:normal;min-width:140px">${esc(x.driver_note || '')}</td><td dir="ltr" style="font-weight:700">${esc(x.track_code || '')}</td><td><button data-act="edit" data-id="${x.id}">تعديل</button> ${cancel}</td></tr>`;
    }).join('') || '<tr><td colspan="14">لا طلبات</td></tr>') + '</table>';
  const pages = Math.max(1, Math.ceil((o.count || 0) / PAGE));
  $('pg').textContent = `${page + 1} / ${pages} (${o.count || 0} طلب)`;
  $('pv').disabled = page === 0; $('nx').disabled = page + 1 >= pages;
}

async function sendDriverPosition(p, force = false) {
  if (!shareWanted || locationBusy) return;
  // عند استئناف الصفحة نرسل القراءة الحالية فورًا حتى لو كان آخر إرسال حديثًا.
  if (!force && Date.now() - lastSend < 15000) return;
  locationBusy = true;
  try {
    const { error } = await safeRpc('dlv_update_location', {
      p_lat: p.coords.latitude, p_lng: p.coords.longitude, p_acc: p.coords.accuracy
    });

function bikeBearing(a, b) {
  if (!a || !b || (a.lat === b.lat && a.lng === b.lng)) return 0;
  const rad = Math.PI / 180, y = Math.sin((b.lng-a.lng)*rad)*Math.cos(b.lat*rad);

  if (!marker || !Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return;

  const prior = riderAnimations.get(marker);
  if (prior) cancelAnimationFrame(prior);
  const start = marker.getLatLng();
  if (start.distanceTo(target) < 2 || start.distanceTo(target) > 2000 || document.visibilityState !== 'visible') {
    marker.setLatLng(target); riderAnimations.delete(marker); return;
  }
  const startAt = performance.now();
  const ease = t => t*t*(3-2*t);
  function step(now) {
    if (!marker._map || document.visibilityState !== 'visible') {
      marker.setLatLng(target); riderAnimations.delete(marker); return;
    }
    const p = Math.min(1,(now-startAt)/duration), k=ease(p);
    marker.setLatLng([start.lat+(target.lat-start.lat)*k,start.lng+(target.lng-start.lng)*k]);

}

    '<img src="rider-motorcycle-v3.svg" alt="طيار واحة اليمن" draggable="false" style="display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.38))">'+

}
async function kitchenForward(id) {
  if (!requireOnline('تحويل الطلب للمشرف')) return;
  const { error } = await safeRpc('dlv_kitchen_forward', { p_order_id: id, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتحوّل للمشرف ✅', true); refreshView();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me && me.role === 'driver') {
    if (!shareWanted && watchId == null && !window._sd) startShare();
    else if (shareWanted) resumeDriverLocationNow();
  }
});

/* ---------- أكواد متابعة العملاء (للموظفين) ---------- */
const trackMsg = o => 'أهلًا ' + (o.customer_name || '') + '، تابع طلبك رقم #' + o.order_no + ' من هنا:\n' + location.origin + location.pathname + '?t=' + o.track_code + '\nكود المتابعة: ' + o.track_code;
function copyMsg(id) { const o = ORD[id]; if (!o) return; navigator.clipboard && navigator.clipboard.writeText(trackMsg(o)); flash('اتنسخت رسالة العميل، ابعتها له', true); }
function waMsg(id) {
  const o = ORD[id]; if (!o) return; let d = (o.phone || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '20' + d.slice(1);
  window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(trackMsg(o)), '_blank');
}
async function loadCodes() {
  const box = $('codes'); if (!box) return;
  const { data, error } = await branchQuery(sb.from('dlv_orders').select('*, driver:driver_id(full_name)')).not('track_code', 'is', null).in('status', ['new', 'received', 'out']).order('created_at', { ascending: false }).limit(200);
  if (error) return;
  const rows = data || []; rows.forEach(o => ORD[o.id] = o);
  box.innerHTML = rows.length ? '<h2>🔑 أكواد متابعة العملاء (' + rows.length + ')</h2>' + rows.map(o => '<div class="card"><div class="ord"><b style="font-size:18px">#' + esc(o.order_no) + '</b><b dir="ltr" style="font-size:22px;letter-spacing:2px;color:#4e2c12">' + esc(o.track_code) + '</b></div><div class="meta">' + esc([o.customer_name, o.phone].filter(Boolean).join(' · ')) + ' — الطيار: ' + esc(o.driver ? o.driver.full_name : '') + '</div><div class="acts"><button class="p" data-act="cpmsg" data-id="' + o.id + '">نسخ رسالة العميل</button>' + (o.phone ? '<button class="g" data-act="wa" data-id="' + o.id + '">واتساب</button>' : '') + '</div></div>').join('') : '';
}

/* ---------- صفحة العميل: تتبع الطلب بالكود (من غير دخول) ---------- */
function trackView(code0) {
  document.title = 'تتبع طلبك — '+(brandConfig.brand_name||'واحة اليمن');
  $('app').innerHTML = '<header><img data-brand-logo src="logo-original.png" alt="شعار البراند" style="width:52px;height:52px;min-width:52px;flex:0 0 52px;border-radius:10px;object-fit:contain;object-position:center;background:transparent;padding:2px"><div style="flex:1"><div style="font-size:20px;font-weight:700">تتبع طلبك</div><small data-brand-title>واحة اليمن</small></div></header>' +
    '<div class="card"><label style="font-size:12px">كود المتابعة</label><div class="row"><input id="tc" dir="ltr" style="flex:1;text-transform:uppercase" placeholder="مثال: 7K2M9QXA" value="' + esc((code0 || '').toUpperCase()) + '"><button class="p" id="tg">تتبّع</button></div></div>' +
    '<div id="tinfo"></div><div id="tmap" class="card" style="height:320px;display:none;padding:0;overflow:hidden"></div>';
  let tmr, mapT, mk, lastTrackPos = null, trackBusy = false;
  async function go() {
    const code = $('tc') ? $('tc').value.trim().toUpperCase() : ''; if (!code) return;
    if (trackBusy || document.visibilityState !== 'visible' || !navigator.onLine) return;
    trackBusy = true;
    let result;
    try { result = await safeRpc('dlv_track', { p_code: code }); }
    catch (e) { result = { error: e }; }
    finally { trackBusy = false; }
    const { data: j, error } = result || {};
    const box = $('tinfo'); if (!box) return clearInterval(tmr);
    if (error) {
      // Transient network/API errors must never terminate the customer's tracking session.
      const warn = $('trackConnectionNotice');
      if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">الاتصال بالخريطة متقطع مؤقتًا؛ سنحاول التحديث تلقائيًا دون إغلاق المتابعة.</div>');
      return;
    }
    if (!j || !j.found) {
      if (j && j.limited) {
        const warn = $('trackConnectionNotice');
        if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">ضغط مؤقت على خدمة التتبع؛ سنعيد المحاولة تلقائيًا.</div>');
        return;
      }
      box.innerHTML = '<div class="msg e">' + (j && j.expired ? 'انتهت صلاحية الكود' : 'الكود غير صحيح، راجع الكود مع خدمة العملاء') + '</div>';
      $('tmap').style.display = 'none'; clearInterval(tmr); return;
    }
    const oldNotice = $('trackConnectionNotice'); if (oldNotice) oldNotice.remove();
    const S = ['تم تسجيل طلبك', 'جاري التجهيز في المطبخ', 'جاهز ومع المشرف', 'اتعيّن لك طيار', 'الطيار خرج لك', 'تم التسليم'];
    const idx = j.status === 'delivered' ? 5 : j.status === 'out' ? 4 : j.pilot_name ? 3 : (j.stage === 'kitchen_ready' || j.stage === 'supervisor_received') ? 2 : 1;
    let h = '<div class="card"><b style="font-size:20px">طلب رقم #' + esc(j.order_no) + '</b>';
    if (j.status === 'failed') h += '<div class="msg e" style="margin-top:10px">تعذر توصيل الطلب، هيتواصل معاك فريق الخدمة.</div>';
    else if (j.status === 'cancelled') h += '<div class="msg e" style="margin-top:10px">تم إلغاء الطلب.</div>';
    else h += S.map((t, i) => '<div class="od" style="margin-top:8px;opacity:' + (i <= idx ? 1 : .45) + '"><span>' + (i < idx ? '✓ ' : i === idx ? '● ' : '○ ') + t + '</span>' + (i === 4 && j.out_at ? '<span class="meta">' + tm(j.out_at) + '</span>' : i === 5 && j.delivered_at ? '<span class="meta">' + tm(j.delivered_at) + '</span>' : '') + '</div>').join('');
    if(j.pilot_reassigned) h += '<div class="msg o" style="margin-top:10px">🔁 تم تغيير الطيار المسؤول عن طلبك. بيانات الطيار المعروضة هي البيانات الحالية.</div>';
    h += '</div>';
    if (j.pilot_name && j.status !== 'failed' && j.status !== 'cancelled') {
      const rawPilotPhone = String(j.pilot_phone || '').trim();
      let pilotDigits = rawPilotPhone.replace(/\D/g, '');
      if (pilotDigits.startsWith('0')) pilotDigits = '20' + pilotDigits.slice(1);
      const hasPilotPhone = /^20(?:10|11|12|15)\d{8}$/.test(pilotDigits) || /^\d{10,15}$/.test(pilotDigits) && !pilotDigits.startsWith('0');
      const callAction = hasPilotPhone
        ? '<a href="tel:+' + pilotDigits + '" class="pilot-contact-btn pilot-call" dir="rtl"><span aria-hidden="true">☎</span> اتصال</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">☎ اتصال</button>';
      const waAction = hasPilotPhone
        ? '<a href="https://wa.me/' + pilotDigits + '" target="_blank" rel="noopener noreferrer" class="pilot-contact-btn pilot-wa" dir="rtl"><span aria-hidden="true">◉</span> واتساب</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">◉ واتساب</button>';
      h += '<div class="card pilot-contact-card"><div class="meta">الطيار</div><b style="font-size:20px">' + esc(j.pilot_name) + '</b><div class="pilot-contact-actions">' + callAction + waAction + '</div>' + (!hasPilotPhone ? '<div class="meta">أزرار التواصل جاهزة؛ ستعمل بعد إضافة رقم الطيار في إدارة الحسابات.</div>' : '<div class="meta" dir="ltr" style="text-align:right">' + esc(rawPilotPhone) + '</div>') + '</div>';
    }
    box.innerHTML = h;
    const m = $('tmap');
    if (j.lat != null) {
      m.style.display = 'block';
      if (!mapT) { mapT = L.map('tmap').setView([j.lat, j.lng], 15); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapT); mk = L.marker([j.lat, j.lng], { icon: bikeIcon(0, true, 104), keyboard: false }).addTo(mapT); lastTrackPos = {lat:j.lat,lng:j.lng}; }
      else { const nextPos = {lat:j.lat,lng:j.lng}; const bearing = bikeBearing(lastTrackPos, nextPos); animateRiderMarker(mk,j.lat,j.lng,4200); mk.setIcon(bikeIcon(bearing, true, 104)); mapT.panTo([j.lat, j.lng],{animate:true,duration:1}); lastTrackPos = nextPos; }
    } else m.style.display = 'none';
    if (j.status === 'delivered') {
      m.style.display = 'none';
      if (mapT) { mapT.remove(); mapT = null; mk = null; lastTrackPos = null; }
      const already = j.rated === true;
      if (already) {
        box.innerHTML += '<div class="card"><h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييمك بنجاح.</div></div>';
      } else {
        box.innerHTML += `<div class="card" id="ratingCard"><h2>⭐ قيّم تجربتك مع واحة اليمن</h2><div class="meta">يسعدنا نعرف رأيك بعد استلام طلبك.</div>
          <label>تقييم الطيار</label><div class="rateRow" data-rate="delivery">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم المطعم</label><div class="rateRow" data-rate="restaurant">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم موظف متابعة الكول سنتر</label><div class="rateRow" data-rate="callcenter">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تعليقك (اختياري)</label><textarea id="rateComment" maxlength="1000" placeholder="اكتب ملاحظاتك هنا"></textarea>
          <button class="p big" id="sendRating">إرسال التقييم</button><div id="rateMsg" class="meta"></div></div>`;
        const scores={delivery:0,restaurant:0,callcenter:0};
        document.querySelectorAll('.rateRow').forEach(row=>row.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const key=row.dataset.rate;scores[key]=Number(btn.dataset.v);row.querySelectorAll('button').forEach(b=>b.textContent=Number(b.dataset.v)<=scores[key]?'★':'☆');}));
        $('sendRating').onclick=async()=>{if(!scores.delivery||!scores.restaurant||!scores.callcenter){$('rateMsg').textContent='من فضلك قيّم الأقسام الثلاثة';return;}
          $('sendRating').disabled=true;$('rateMsg').textContent='جارٍ إرسال تقييمك...';
          try {
            const {data,error}=await safeRpc('dlv_submit_customer_rating',{p_code:code,p_delivery:scores.delivery,p_restaurant:scores.restaurant,p_callcenter:scores.callcenter,p_comment:$('rateComment').value||null});
            if(error){$('sendRating').disabled=false;$('rateMsg').textContent=error.message;return;}
            if(data?.rate_limited){$('sendRating').disabled=false;$('rateMsg').textContent=data.message||'محاولات كثيرة. حاول مرة أخرى بعد دقيقة';return;}
            if(data?.already_rated){$('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييم هذا الطلب من قبل.</div>';return;}
            if(data?.success!==true){$('sendRating').disabled=false;$('rateMsg').textContent=data?.message||'لم نتمكن من حفظ التقييم. حاول مرة أخرى.';return;}
            $('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">وصل تقييمك لصاحب النظام وفريق متابعة الكول سنتر.</div>';
          } catch(e) {
            $('sendRating').disabled=false;
            $('rateMsg').textContent='تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.';
          }
        };
      }
      clearInterval(tmr);
    }
  }
  $('tg').onclick = () => { clearInterval(tmr); go(); tmr = setInterval(go, 5000); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('tc')) go(); });
  window.addEventListener('online', () => { if ($('tc')) go(); });
  if (code0) $('tg').onclick();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const _t = new URLSearchParams(location.search).get('t'); (async()=>{await loadBrandConfig(); if (_t !== null) { subscribeBrandConfig(); trackView(_t); } else boot();})();
</script>
