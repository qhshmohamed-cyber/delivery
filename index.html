<style>
:root{--bg:#dca86f;--card:#fff8ea;--text:#3a2412;--muted:#5b4128;--line:#dcc49a;--brand:#5a3317;--gold:#b9832e}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:12px 0;position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#4e2c12;color:#f4e9d2;border-radius:16px;padding:10px 12px;border-bottom:3px solid #b9832e}
header h1{font-size:16px;margin:0;flex:1}header small{display:block;color:#e0cba6;font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button,input,select,textarea{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;width:100%}
button{width:auto;cursor:pointer;font-weight:600}
button.p{background:var(--brand);color:#fff;border-color:var(--brand)}
button.g{background:var(--gold);color:#fff;border-color:var(--gold)}
button.r{color:#e03131;border-color:#e03131}
button:disabled{opacity:.5}
.big{width:100%;padding:14px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.badge{font-size:11px;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
.late{color:#e03131;font-size:12px;font-weight:700}
.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.ord{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:600}
.msg{padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}
.msg.e{background:#ffe3e3;color:#c92a2a}.msg.o{background:#d3f9d8;color:#2b8a3e}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.hide{display:none}.grow{flex:1;min-width:0}h2{font-size:14px;margin:12px 0 6px}body{min-height:100vh}body::before{content:"";position:fixed;inset:0;background:url(icon-512.png) center 38%/min(88vw,480px) no-repeat;opacity:.22;pointer-events:none;z-index:0}@media print{body>*:not(#rpt){display:none!important}body::before{display:none}#rpt{position:static!important;overflow:visible!important;background:#fff!important}.noprint{display:none!important}}.leaflet-container{font:inherit}.leaflet-popup-content{direction:rtl;text-align:right}
.ys-bike-marker{background:transparent!important;border:0!important;overflow:visible!important}.ys-bike-marker div{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ys-bike-marker{background:transparent!important;border:0!important;overflow:visible!important}
.ys-bike-pin{position:relative;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 5px 9px rgba(25,15,8,.35))}
.ys-bike-core{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#8c2420,#54100f);border:3px solid #e7c477;box-shadow:inset 0 0 0 2px rgba(255,244,218,.22),0 0 0 3px rgba(123,23,23,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ys-bike-crown{font-size:7px;font-weight:900;letter-spacing:.1px;color:#f5d995;line-height:9px;margin-top:2px}
.ys-bike-core svg{display:block;margin-top:-1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.ys-bike-status{position:absolute;right:2px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--bike-status);border:2px solid #fff;z-index:3}
.ys-bike-pulse{position:absolute;inset:2px;border:2px solid var(--bike-status);border-radius:50%;opacity:.55;animation:ysBikePulse 2s ease-out infinite}
@keyframes ysBikePulse{0%{transform:scale(.82);opacity:.65}100%{transform:scale(1.35);opacity:0}}
.ys-map-shell{background:#f7f4ed;border-top:1px solid #d8c59c}
.ys-map-head{background:linear-gradient(110deg,#4d100f,#7b1717 65%,#9a3027);color:#fff;padding:12px 14px;box-shadow:0 3px 12px #32100e33}
.ys-map-head .meta{color:#f4dfb4!important}
.ys-map-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fffaf0;color:#55351f;font-size:12px;border-top:1px solid #e7d8b8}
.ys-map-legend span{display:inline-flex;align-items:center;gap:5px}
.ys-map-dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #fff;box-shadow:0 0 0 1px #aaa}
.leaflet-popup-content-wrapper{border-radius:14px!important;border:1px solid #d8b76e;box-shadow:0 8px 24px #24140f33!important}
.leaflet-popup-content{margin:12px 15px!important;line-height:1.8!important}
.leaflet-control-zoom a{color:#6b1717!important}
\n.rateRow{display:flex;gap:8px;margin:6px 0 14px;direction:ltr}.rateStar{font-size:30px;color:#b8862b;background:#fff8e8;border:1px solid #d9b36a;border-radius:10px;padding:2px 9px;min-width:42px}.rateRow .rateStar:focus{outline:2px solid #7b1717}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== الإعدادات: ضع بيانات مشروعك من Supabase > Project Settings > API ===== */
const SB_URL = 'https://mkptmejkcemdhlhdaort.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rcHRtZWprY2VtZGhsaGRhb3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwODE2MTQsImV4cCI6MjEwOTY1NzYxNH0.ovPRrF8RDXPut2jY8HMHdO27sFvxmyDymBVAKBV7mC8';
/* ============================================================================= */
const sb = supabase.createClient(SB_URL, SB_KEY);
const ST = {new:['جديد','#868e96'],received:['تم الاستلام','#1c7ed6'],out:['خرج للتوصيل','#e8590c'],
  delivered:['تم التوصيل','#2f9e44'],failed:['تعذر التوصيل','#e03131'],cancelled:['ملغي','#adb5bd']};
const REASONS = ['العميل لا يرد','العميل ألغى الطلب','العنوان غير صحيح','مشكلة في الطلب','سبب آخر'];
const STG = {new:'عند المطبخ', kitchen_ready:'جاهز من المطبخ', supervisor_received:'عند المشرف', driver_assigned:'اتحوّل لطيار'};
const LATE_MIN = 45, PAGE = 25;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const generateStrongPassword = () => { const sets=['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@#$%*-_']; const all=sets.join(''); const bytes=crypto.getRandomValues(new Uint8Array(16)); const chars=sets.map((set,i)=>set[bytes[i]%set.length]); for(let i=4;i<16;i++) chars.push(all[bytes[i]%all.length]); for(let i=chars.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint8Array(1))[0]%(i+1);[chars[i],chars[j]]=[chars[j],chars[i]];} return chars.join(''); };
const cairoDate = d => (d || new Date()).toLocaleDateString('en-CA', {timeZone:'Africa/Cairo'});
const tm = t => t ? new Date(t).toLocaleTimeString('ar-EG', {timeZone:'Africa/Cairo', hour:'2-digit', minute:'2-digit'}) : '—';
const mins = (a, b) => (a && b) ? Math.round((new Date(b) - new Date(a)) / 60000) : null;
const isLate = o => ['new','received','out'].includes(o.status)
  ? mins(o.received_at || o.created_at, new Date()) > LATE_MIN
  : o.status === 'delivered' && mins(o.received_at || o.created_at, o.delivered_at) > LATE_MIN;
let me = null, drivers = [], page = 0, timer = null, chan = null, delayTimer = null, selectedBranch = null;
const branchQuery = q => (selectedBranch ? q.eq('branch_id', selectedBranch) : q);
const ORD = {};
// اعتبر الحساب مالك النظام إذا كان أي من حقلي الدور يحدد admin.
const isOwner = () => !!me && me.role === 'admin' && me.workflow_role === 'admin';
const isLocationManager = () => !!me && me.role === 'manager' && me.workflow_role === 'manager';
const branchTitle = id => ({1:'فرع المهندسين',2:'فرع الشيخ زايد'}[Number(id)] || 'فرع غير محدد');
const permittedBranches = () => (Array.isArray(me?.allowed_branch_ids) && me.allowed_branch_ids.length ? me.allowed_branch_ids : [me?.branch_id]).filter(Boolean);
const activeBranchTitle = () => selectedBranch ? branchTitle(selectedBranch) : 'عرض الفرعين معًا';
const canViewManagerBoard = () => isOwner() || isLocationManager();

function flash(t, ok) {
  const m = $('flash'); if (!m) return;
  m.className = 'msg ' + (ok ? 'o' : 'e'); m.textContent = t;
  setTimeout(() => { if (m) m.className = 'hide'; }, 4000);
}
const roleLabel = u => u.role === 'manager' ? ({callcenter_followup:'متابعة كول سنتر',supervisor:'مشرف',kitchen:'كنترول المطبخ',manager:'مدير'}[u.workflow_role] || u.job_title || 'مدير') : ({ driver: 'طيار', admin: 'مالك النظام' }[u.role] || '');
const shell = (inner) => { const canSwitch = isOwner() || permittedBranches().length > 1; return `<header><img src="icon-192.png" alt="شعار مطاعم واحة اليمن" style="width:46px;height:46px;border-radius:12px"><div style="flex:1;min-width:0"><small style="opacity:.8">واحة اليمن — متابعة الدليفري</small><div id="hname" style="font-size:18px;font-weight:700;line-height:1.3">${esc(me.full_name)}</div><small id="hmeta">${esc(roleLabel(me))} · كود ${esc(me.employee_code)}</small><div style="margin-top:4px;font-size:12px;font-weight:700;color:#ffe0a3">📍 الفرع الحالي: <span id="activeBranchLabel">${esc(activeBranchTitle())}</span></div></div>${canSwitch ? '<button id="branchSwitch" style="white-space:nowrap">تغيير الفرع</button>' : ''}<button id="out">خروج</button></header><div id="flash" class="hide"></div><div id="delayNotices"></div>${inner}`; };

/* ---------- الدخول ---------- */
function reconnectView(message='الاتصال بالخادم غير متاح حاليًا. بيانات الدخول محفوظة؛ أعد المحاولة عند رجوع الإنترنت.') {
  $('app').innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;text-align:center"><img src="icon-192.png" alt="شعار مطاعم واحة اليمن" style="width:90px;height:90px;border-radius:18px"><h1 style="font-size:18px">تعذر الاتصال</h1><p class="meta">${esc(message)}</p><button class="p big" id="retryBoot">إعادة المحاولة</button><button id="retryLogout" style="margin-top:10px">تسجيل الخروج</button></div>`;
  $('retryBoot').onclick=()=>boot();
  $('retryLogout').onclick=async()=>{await sb.auth.signOut();me=null;selectedBranch=null;loginView();};
}
function loginView(err) {
  $('app').innerHTML = `<div class="card" style="max-width:380px;margin:40px auto"><img src="icon-192.png" alt="شعار مطاعم واحة اليمن" style="width:110px;height:110px;border-radius:22px;display:block;margin:0 auto 10px"><h1 style="font-size:18px;text-align:center">تسجيل الدخول</h1>
    <div class="msg e ${err ? '' : 'hide'}">${esc(err)}</div>
    <label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username">
    <label style="margin-top:8px;display:block">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
    <button class="p big" id="go" style="margin-top:14px">دخول</button><div style="text-align:center;margin-top:16px"><a href="?t=" style="color:#4e2c12;font-weight:700">أنا عميل — عايز أتابع طلبي</a></div></div>`;
  $('go').onclick = async () => {
    $('go').disabled = true;
    try {
      const {error} = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
      if (error) { loginView(error.message?.toLowerCase().includes('fetch') ? 'تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى' : 'بيانات الدخول غير صحيحة'); return; }
      await boot();
    } catch (e) { reconnectView('تعذر إكمال تسجيل الدخول بسبب الاتصال. أعد المحاولة دون إعادة إدخال بياناتك إذا كانت الجلسة قد حُفظت.'); }
  };
}
let realtimeState = 'CLOSED';
let realtimeRetryTimer = null;
let reconnectRefreshTimer = null;
function refreshOperationalData() {
  if (!me || document.visibilityState !== 'visible') return;
  clearTimeout(reconnectRefreshTimer);
  reconnectRefreshTimer = setTimeout(() => {
    refreshView();
    if (canViewManagerBoard()) {
      loadManagerLiveKpis(); loadManagerOpsPending(); loadManagerDelayed();
      loadManagerRatings(); refreshKitchenDelayNotices();
    }
  }, 350);
}
function startOrderRealtime() {
  if (!me) return;
  if (chan) { try { sb.removeChannel(chan); } catch (e) {} chan = null; }
  chan = sb.channel('dlv-orders-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'dlv_orders'}, refreshOperationalData)
    .subscribe(status => {
      realtimeState = status;
      if (status === 'SUBSCRIBED') {
        clearTimeout(realtimeRetryTimer);
        refreshOperationalData();
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        clearTimeout(realtimeRetryTimer);
        realtimeRetryTimer = setTimeout(() => {
          if (me && navigator.onLine && document.visibilityState === 'visible') startOrderRealtime();
        }, 5000);
      }
    });
}
window.addEventListener('online', () => {
  if (!me) return;
  refreshOperationalData();
  if (!chan || realtimeState !== 'SUBSCRIBED') startOrderRealtime();
  refreshMe();
});
window.addEventListener('offline', () => {
  const app = $('app');
  if (app && me) flash('الاتصال انقطع — البيانات المعروضة قد لا تكون محدثة. سنعيد المزامنة عند عودة الإنترنت.', false);
});
async function boot() {
  let authResult;
  try { authResult = await sb.auth.getSession(); } catch (e) { return reconnectView(); }
  if (authResult.error) return reconnectView();
  const session = authResult.data?.session;
  if (!session) return loginView();
  let profileResult;
  try { profileResult = await sb.from('dlv_profiles').select('*').eq('user_id', session.user.id).maybeSingle(); }
  catch (e) { return reconnectView(); }
  const {data, error} = profileResult;
  if (error) return reconnectView('تعذر التحقق من صلاحيات الحساب بسبب الاتصال. لم يتم تسجيل خروجك.');
  if (!data || !data.active) { await sb.auth.signOut(); return loginView('الحساب غير مفعّل أو غير مربوط بموظف'); }
  me = data;
  if (isOwner()) { await ownerBranchPicker(); return; }
  const permitted = Array.isArray(me.allowed_branch_ids) && me.allowed_branch_ids.length ? me.allowed_branch_ids : [me.branch_id];
  if (permitted.length > 1) { await employeeBranchPicker(permitted); return; }
  selectedBranch = me.branch_id;
  if (['supervisor','manager','admin'].includes(me.workflow_role || me.role)) {
    const r = await safeRpc('dlv_list_active_drivers');
    if (r.error) { drivers = []; console.error('تعذر تحميل الطيارين:', r.error.message); }
    else drivers = (r.data || []).filter(x => !selectedBranch || x.branch_id === selectedBranch);
  } else {
    drivers = [];
  }
  me.role === 'driver' ? driverView() : me.workflow_role === 'kitchen' ? kitchenView() : me.workflow_role === 'callcenter_followup' ? callcenterView() : managerView();
  startKitchenDelayMonitor();
  startOrderRealtime();
}
async function employeeBranchPicker(permitted){
  const {data,error}=await safeRpc('dlv_my_branches');
  if(error){console.warn('تعذر تحميل فروع الحساب:',error.message);return reconnectView('تعذر تحميل فروع حسابك الآن. جلسة الدخول محفوظة؛ أعد المحاولة.');}
  const branches=(data||[]).filter(b=>permitted.includes(b.id));
  if(!branches.length){return reconnectView('لا يوجد فرع مسموح لهذا الحساب حاليًا. لم نسجّل خروجك؛ راجع مسؤول النظام.');}
  $('app').innerHTML=`<div class="card" style="max-width:520px;margin:35px auto;text-align:center;padding:22px"><h1>اختيار فرع العمل</h1><p class="meta">أهلاً ${esc(me.full_name)} — اختر الفرع الذي ستعمل عليه</p><div class="grid" style="grid-template-columns:1fr">${branches.map(b=>`<button class="p big" data-emp-branch="${b.id}">${esc(b.name)}</button>`).join('')}</div><button id="empOut">تسجيل الخروج</button></div>`;
  document.querySelectorAll('[data-emp-branch]').forEach(b=>b.onclick=async()=>{selectedBranch=Number(b.dataset.empBranch);await enterEmployeeDashboard();});
  $('empOut').onclick=async()=>{await sb.auth.signOut();me=null;selectedBranch=null;loginView();};
}
async function enterEmployeeDashboard(){
  if(me.role!=='driver' && ['supervisor','manager','admin'].includes(me.workflow_role||me.role)){const r=await safeRpc('dlv_list_active_drivers');if(r.error){flash('تعذر تحميل قائمة الطيارين: '+r.error.message,false);drivers=[];}else drivers=(r.data||[]).filter(x=>!selectedBranch||x.branch_id===selectedBranch);}
  me.role==='driver'?driverView():me.workflow_role==='kitchen'?kitchenView():me.workflow_role==='callcenter_followup'?callcenterView():managerView();
  startKitchenDelayMonitor();startOrderRealtime();
}
async function ownerBranchPicker(){
  const {data,error}=await safeRpc('dlv_list_branches');
  if(error){ console.warn('تعذر تحميل قائمة الفروع:',error.message); return reconnectView('تعذر تحميل قائمة الفروع الآن. جلسة الدخول محفوظة؛ أعد المحاولة.'); }
  const branches=data||[];
  $('app').innerHTML=`<div class="card" style="max-width:520px;margin:35px auto;text-align:center;padding:22px"><img src="icon-192.png" style="width:90px;height:90px;border-radius:18px"><h1 style="font-size:20px">اختيار الفرع</h1><p class="meta">أهلاً ${esc(me.full_name)} — اختر نطاق لوحة المتابعة</p><div class="grid" style="grid-template-columns:1fr;gap:10px">${branches.map(b=>`<button class="p big" data-branch="${b.id}">${esc(b.name)}</button>`).join('')}<button class="g big" data-branch="all">عرض الفرعين معًا</button></div><button id="pickOut" style="margin-top:10px">تسجيل الخروج</button></div>`;
  document.querySelectorAll('[data-branch]').forEach(b=>b.onclick=async()=>{selectedBranch=b.dataset.branch==='all'?null:Number(b.dataset.branch); await enterOwnerDashboard();});
  $('pickOut').onclick=async()=>{await sb.auth.signOut();me=null;selectedBranch=null;loginView();};
}
async function enterOwnerDashboard(){
  const r=await sb.from('dlv_profiles').select('user_id,full_name,employee_code,branch_id').eq('role','driver').eq('active',true).order('full_name');
  if(r.error){console.warn('تعذر تحميل الطيارين:',r.error.message);return reconnectView('تعذر تحميل بيانات الطيارين الآن. جلسة الدخول محفوظة؛ أعد المحاولة.');}
  drivers=(r.data||[]).filter(x=>!selectedBranch||x.branch_id===selectedBranch);
  managerView(); startKitchenDelayMonitor();
  startOrderRealtime();
}

async function refreshKitchenDelayNotices() {
  if (!me || !(canViewManagerBoard() || me.workflow_role === 'callcenter_followup')) return;
  const {data,error} = await safeRpc('dlv_list_notifications');
  const box = $('delayNotices'); if (!box) return;
  if (error) { box.innerHTML = '<div class="msg e">تعذر تحميل التنبيهات: '+esc(error.message)+'</div>'; return; }
  // التنبيه المقروء يختفي من الشاشة نهائيًا، مع بقائه محفوظًا في السجل.
  const rows = (data || []).filter(n => !n.read_at && (n.notification_type === 'kitchen_delay' || !n.notification_type));

/* ---------- العمليات ---------- */
async function safeRpc(name, args) {
  try {
    const result = await sb.rpc(name, args);
    return result || { data: null, error: { message: 'لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة.' } };
  } catch (err) {
    const message = err && err.message ? err.message : 'تعذر الاتصال بالخادم. لم يتم تأكيد حفظ العملية.';
    return { data: null, error: { message } };
  }
}
function requireOnline(action='تنفيذ العملية') {
  if (navigator.onLine) return true;
  flash(`لا يمكن ${action} بدون اتصال بالإنترنت. لم يتم حفظ أي تغيير؛ أعد المحاولة بعد عودة الاتصال.`, false);
  return false;
}
async function setStatus(id, to, note) {

  flash('تم التحديث', true);
  refreshView();
}

    Object.keys(markers).forEach(k => { if (!seen.has(k)) { map.removeLayer(markers[k]); delete markers[k]; } });
    $('mcount').textContent = only && !seen.size ? 'الطيار ده مش بيشارك موقعه' : seen.size + ' طيار';
    if (!fitted && seen.size) { if (only) { const m = markers[only]; map.setView(m.getLatLng(), 16); m.openPopup(); } else map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.3)); fitted = true; }
  }
  $('msel').onchange = () => { fitted = false; refresh(); };
  refresh(); mapTimer = setInterval(refresh, 10000);
  $('mclose').onclick = () => { clearInterval(mapTimer); map.remove(); d.remove(); };
}

function openReport() {
  const d = document.createElement('div'); d.id = 'rpt';
  d.style.cssText = 'position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0) 12px 24px';

    '<div class="noprint" style="margin-bottom:10px"><input type="date" id="rdt" value="' + cairoDate() + '"></div><div id="rbody"><div class="meta">جاري التحميل...</div></div>';

  async function load() {
    const day = $('rdt').value; let rows = [], from = 0;
    for (;;) {
      const { data, error } = await branchQuery(sb.from('dlv_orders').select('*, driver:driver_id(full_name)')).eq('order_date', day).order('created_at').range(from, from + 999);
      if (error) { $('rbody').innerHTML = '<div class="msg e">' + esc(error.message) + '</div>'; return; }
      rows = rows.concat(data || []); if (!data || data.length < 1000) break; from += 1000;
    }
    const c = st => rows.filter(o => o.status === st).length;
    const durOf = o => mins(o.out_at, o.delivered_at);
    const avgOf = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
    const late = rows.filter(isLate).length, open = rows.filter(o => ['new', 'received', 'out'].includes(o.status)).length;
    const avg = avgOf(rows.filter(o => o.status === 'delivered').map(durOf).filter(v => v != null));
    const by = {};
    rows.forEach(o => {
      const n = o.driver ? o.driver.full_name : '؟';
      const g = by[n] = by[n] || { t: 0, d: 0, o: 0, f: 0, l: 0, du: [] };
      g.t++; if (o.status === 'delivered') { g.d++; const m = durOf(o); if (m != null) g.du.push(m); }
      if (['new', 'received', 'out'].includes(o.status)) g.o++; if (o.status === 'failed') g.f++; if (isLate(o)) g.l++;
    });
    const names = Object.keys(by).sort((a, b) => by[b].t - by[a].t);
    const fails = rows.filter(o => o.status === 'failed'), notes = rows.filter(o => o.driver_note);
    const nm = o => o.driver ? o.driver.full_name : '؟';
    text = '📊 تقرير الدليفري — واحة اليمن\nالتاريخ: ' + day + '\nإجمالي الطلبات: ' + rows.length + '\n✅ تم التوصيل: ' + c('delivered') + '\n🛵 خرج للتوصيل: ' + c('out') +
      '\n📥 لم يخرج بعد: ' + (c('new') + c('received')) + '\n⛔ تعذر: ' + c('failed') + '\n❌ ملغي: ' + c('cancelled') + '\n⚠ متأخر: ' + late +
      '\n⏱ متوسط مدة التوصيل: ' + (avg == null ? '—' : avg + ' د') + '\n\nحسب الطيار:\n' +
      names.map(n => '- ' + n + ': ' + by[n].t + ' طلب · تم ' + by[n].d + ' · تعذر ' + by[n].f + ' · متأخر ' + by[n].l + ' · متوسط ' + (avgOf(by[n].du) == null ? '—' : avgOf(by[n].du) + ' د')).join('\n') +
      (fails.length ? '\n\nتعذر التوصيل:\n' + fails.map(o => '- #' + o.order_no + ' (' + nm(o) + '): ' + (o.failed_reason || '') + (o.driver_note ? ' | ' + o.driver_note : '')).join('\n') : '') +
      (notes.length ? '\n\nملاحظات الطيارين:\n' + notes.map(o => '- #' + o.order_no + ' (' + nm(o) + '): ' + o.driver_note).join('\n') : '');
    const kp = [['إجمالي الطلبات', rows.length], ['تم التوصيل', c('delivered')], ['خرجت للتوصيل', c('out')], ['لم تخرج بعد', c('new') + c('received')], ['تعذر', c('failed')], ['ملغي', c('cancelled')], ['متأخرة', late], ['متوسط التوصيل (د)', avg == null ? '—' : avg]];
    $('rbody').innerHTML = '<h2 style="font-size:16px">واحة اليمن — تقرير يوم ' + esc(day) + '</h2>' +
      '<div class="grid">' + kp.map(k => '<div class="stat"><b>' + k[1] + '</b><span>' + k[0] + '</span></div>').join('') + '</div>' +
      '<h2>حسب الطيار</h2><div class="card tw"><table><tr><th>الطيار</th><th>الإجمالي</th><th>تم</th><th>جاري</th><th>تعذر</th><th>متأخر</th><th>متوسط (د)</th></tr>' +
      (names.map(n => '<tr><td>' + esc(n) + '</td><td>' + by[n].t + '</td><td>' + by[n].d + '</td><td>' + by[n].o + '</td><td>' + by[n].f + '</td><td>' + by[n].l + '</td><td>' + (avgOf(by[n].du) == null ? '—' : avgOf(by[n].du)) + '</td></tr>').join('') || '<tr><td colspan="7">لا طلبات</td></tr>') + '</table></div>' +
      '<h2>كل الطلبات (' + rows.length + ')</h2><div class="card tw"><table><tr><th>الطلب</th><th>الطيار</th><th>العميل</th><th>جاهز (مطبخ)</th><th>استلام المشرف</th><th>تحويل للطيار</th><th>استلام الطيار</th><th>خروج</th><th>تسليم</th><th>المدة</th><th>الحالة</th></tr>' +
      (rows.map(o => '<tr><td><b>#' + esc(o.order_no) + '</b></td><td>' + esc(nm(o)) + '</td><td>' + esc(o.customer_name || '') + '</td><td>' + tm(o.kitchen_ready_at) + '</td><td>' + tm(o.supervisor_received_at) + '</td><td>' + tm(o.pilot_assigned_at) + '</td><td>' + tm(o.received_at) + '</td><td>' + tm(o.out_at) + '</td><td>' + tm(o.delivered_at) + '</td><td>' + (durOf(o) != null ? durOf(o) + ' د' : '—') + '</td>' +
        '<td style="white-space:normal;min-width:150px"><span class="badge" style="background:' + ST[o.status][1] + '">' + ST[o.status][0] + '</span>' + (isLate(o) ? ' <span class="late">⚠</span>' : '') +
        (o.failed_reason ? '<div class="meta">⛔ ' + esc(o.failed_reason) + '</div>' : '') + (o.driver_note ? '<div class="meta">📝 ' + esc(o.driver_note) + '</div>' : '') + '</td></tr>').join('') || '<tr><td colspan="11">لا طلبات في اليوم ده</td></tr>') + '</table></div>';
  }
  $('rdt').onchange = load; load();
}

/* ---------- تحديث بيانات حسابي (الاسم/الوظيفة) ---------- */
async function refreshMe() {
  if (!me || !navigator.onLine) return;
  let result;
  try {
    result = await sb.from('dlv_profiles').select('*').eq('user_id', me.user_id).maybeSingle();
  } catch (e) {
    console.warn('تعذر تحديث بيانات الحساب مؤقتًا:', e?.message || e);
    return;
  }
  if (result?.error) {
    console.warn('تعذر تحديث بيانات الحساب مؤقتًا:', result.error.message);
    return;
  }
  const data = result?.data;
  // عدم وصول بيانات بسبب خطأ مؤقت لا يعني أن الحساب أُلغي أو عُطّل.
  if (!data) return;
  if (!data.active) {
    await sb.auth.signOut();
    me = null;
    selectedBranch = null;
    return loginView('الحساب اتعطّل');
  }
  const roleChanged = data.role !== me.role || data.workflow_role !== me.workflow_role;
  me = data;
  if (roleChanged) return boot();
  const n = $('hname'), m = $('hmeta');
  if (n) n.textContent = me.full_name;
  if (m) m.textContent = roleLabel(me) + ' · كود ' + me.employee_code;
}
setInterval(refreshMe, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    refreshMe();
    if (me) {
      refreshOperationalData();
      if (!chan || realtimeState !== 'SUBSCRIBED') startOrderRealtime();
    }
  }
});

/* ---------- مسار الطلب: مطبخ ← مشرف ← طيار ---------- */
function refreshView() { if (!me) return; if (me.role === 'driver') loadMine(); else if (me.workflow_role === 'kitchen') loadKitchen(); else if (me.workflow_role === 'callcenter_followup') { loadCallcenterOrders(); loadCallcenterRatings(); } else { loadAll(); loadPending(); loadCodes(); } }
const ordCard = (o, btn) => '<div class="card"><div class="ord"><b style="font-size:18px">#' + esc(o.order_no) + '</b><span class="badge" style="background:' + (o.workflow_stage === 'new' ? '#868e96' : '#2f9e44') + '">' + (STG[o.workflow_stage] || '') + '</span></div><div class="meta">' + esc([o.customer_name, o.phone, o.address].filter(Boolean).join(' · ')) + '</div>' + btn + '</div>';
function kitchenView() {
  $('app').innerHTML = shell('<div class="meta">الطلبات الواردة من متابعة الكول سنتر تظهر هنا للتجهيز.</div><div id="kq"></div>');
  bindOut(); loadKitchen();
}
async function loadKitchen() {
  const { data, error } = await branchQuery(sb.from('dlv_orders').select('*')).eq('status', 'new').is('driver_id', null).in('workflow_stage', ['new', 'kitchen_ready']).order('created_at').limit(200);
  if (error) return flash(error.message, false);
  const rows = data || [], a = rows.filter(o => o.workflow_stage === 'new'), b = rows.filter(o => o.workflow_stage === 'kitchen_ready');
  $('kq').innerHTML = '<h2>🍳 عند المطبخ (' + a.length + ')</h2>' + (a.map(o => ordCard(o, '<div class="acts"><button class="p" data-act="kfwd" data-id="' + o.id + '">✅ جاهز — حوّل للمشرف</button></div>')).join('') || '<div class="meta">لا يوجد</div>') +
    '<h2>بانتظار المشرف (' + b.length + ')</h2>' + (b.map(o => ordCard(o, '')).join('') || '<div class="meta">لا يوجد</div>');
}
async function loadPending() {
  const box = $('pend'); if (!box) return;
  const { data, error } = await branchQuery(sb.from('dlv_orders').select('*')).eq('status', 'new').is('driver_id', null).order('created_at').limit(200);
  if (error) return;
  const wf = me.workflow_role || 'manager';
  const rows = (data || []).filter(o => wf !== 'supervisor' || o.workflow_stage === 'kitchen_ready' || o.workflow_stage === 'supervisor_received');
  const recv = o => wf === 'supervisor' && o.workflow_stage === 'kitchen_ready';
  const opts = '<option value="">اختر الطيار...</option>' + drivers.map(x => '<option value="' + x.user_id + '">' + esc(x.full_name) + '</option>').join('');
  box.innerHTML = rows.length ? '<h2>📥 طلبات منتظرة التحويل لطيار (' + rows.length + ')</h2>' + rows.map(o => {
    if (recv(o)) return ordCard(o, '<div class="acts"><button class="p" data-act="srecv" data-id="' + o.id + '">✅ استلمت من المطبخ</button></div>');
    if (o.workflow_stage !== 'supervisor_received') return ordCard(o, '<div class="meta" style="margin-top:8px">بانتظار استلام المشرف من المطبخ</div>');
    return ordCard(o, '<div class="row" style="margin-top:8px"><select id="as_' + o.id + '" style="flex:1">' + opts + '</select><button class="p" data-act="assign" data-id="' + o.id + '">تحويل للطيار</button></div>');
  }).join('') : '';
}
async function assignOrder(id) {
  if (!requireOnline('تحويل الطلب للطيار')) return;
  const sel = $('as_' + id), pid = sel && sel.value; if (!pid) return flash('اختار الطيار الأول', false);
  const { error } = await safeRpc('dlv_assign_driver', { p_order_id: id, p_driver: pid, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتحوّل للطيار ✅', true); refreshView();
}
async function supervisorReceive(id) {
  if (!requireOnline('استلام الطلب من المطبخ')) return;
  const { error } = await safeRpc('dlv_supervisor_receive', { p_order_id: id, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتسجّل استلامك من المطبخ ✅', true); refreshView();
}
async function kitchenForward(id) {
  if (!requireOnline('تحويل الطلب للمشرف')) return;
  const { error } = await safeRpc('dlv_kitchen_forward', { p_order_id: id, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتحوّل للمشرف ✅', true); refreshView();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me && me.role === 'driver') {
    if (!shareWanted && watchId == null && !window._sd) startShare();
    else if (shareWanted) resumeDriverLocationNow();
  }
});

/* ---------- أكواد متابعة العملاء (للموظفين) ---------- */
const trackMsg = o => 'أهلًا ' + (o.customer_name || '') + '، تابع طلبك رقم #' + o.order_no + ' من هنا:\n' + location.origin + location.pathname + '?t=' + o.track_code + '\nكود المتابعة: ' + o.track_code;
function copyMsg(id) { const o = ORD[id]; if (!o) return; navigator.clipboard && navigator.clipboard.writeText(trackMsg(o)); flash('اتنسخت رسالة العميل، ابعتها له', true); }
function waMsg(id) {
  const o = ORD[id]; if (!o) return; let d = (o.phone || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '20' + d.slice(1);
  window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(trackMsg(o)), '_blank');
}
async function loadCodes() {
  const box = $('codes'); if (!box) return;
  const { data, error } = await branchQuery(sb.from('dlv_orders').select('*, driver:driver_id(full_name)')).not('track_code', 'is', null).in('status', ['new', 'received', 'out']).order('created_at', { ascending: false }).limit(200);
  if (error) return;
  const rows = data || []; rows.forEach(o => ORD[o.id] = o);
  box.innerHTML = rows.length ? '<h2>🔑 أكواد متابعة العملاء (' + rows.length + ')</h2>' + rows.map(o => '<div class="card"><div class="ord"><b style="font-size:18px">#' + esc(o.order_no) + '</b><b dir="ltr" style="font-size:22px;letter-spacing:2px;color:#4e2c12">' + esc(o.track_code) + '</b></div><div class="meta">' + esc([o.customer_name, o.phone].filter(Boolean).join(' · ')) + ' — الطيار: ' + esc(o.driver ? o.driver.full_name : '') + '</div><div class="acts"><button class="p" data-act="cpmsg" data-id="' + o.id + '">نسخ رسالة العميل</button>' + (o.phone ? '<button class="g" data-act="wa" data-id="' + o.id + '">واتساب</button>' : '') + '</div></div>').join('') : '';
}

/* ---------- صفحة العميل: تتبع الطلب بالكود (من غير دخول) ---------- */
function trackView(code0) {
  document.title = 'تتبع طلبك — واحة اليمن';
  $('app').innerHTML = '<header><img src="icon-192.png" alt="شعار مطاعم واحة اليمن" style="width:46px;height:46px;border-radius:12px"><div style="flex:1"><div style="font-size:20px;font-weight:700">تتبع طلبك</div><small>واحة اليمن</small></div></header>' +
    '<div class="card"><label style="font-size:12px">كود المتابعة</label><div class="row"><input id="tc" dir="ltr" style="flex:1;text-transform:uppercase" placeholder="مثال: 7K2M9QXA" value="' + esc((code0 || '').toUpperCase()) + '"><button class="p" id="tg">تتبّع</button></div></div>' +
    '<div id="tinfo"></div><div id="tmap" class="card" style="height:320px;display:none;padding:0;overflow:hidden"></div>';
  let tmr, mapT, mk, lastTrackPos = null;
  async function go() {
    const code = $('tc') ? $('tc').value.trim().toUpperCase() : ''; if (!code) return;
    let result;
    try { result = await safeRpc('dlv_track', { p_code: code }); }
    catch (e) { result = { error: e }; }
    const { data: j, error } = result || {};
    const box = $('tinfo'); if (!box) return clearInterval(tmr);
    if (error) {
      // Transient network/API errors must never terminate the customer's tracking session.
      const warn = $('trackConnectionNotice');
      if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">الاتصال بالخريطة متقطع مؤقتًا؛ سنحاول التحديث تلقائيًا دون إغلاق المتابعة.</div>');
      return;
    }
    if (!j || !j.found) {
      if (j && j.limited) {
        const warn = $('trackConnectionNotice');
        if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">ضغط مؤقت على خدمة التتبع؛ سنعيد المحاولة تلقائيًا.</div>');
        return;
      }
      box.innerHTML = '<div class="msg e">' + (j && j.expired ? 'انتهت صلاحية الكود' : 'الكود غير صحيح، راجع الكود مع خدمة العملاء') + '</div>';
      $('tmap').style.display = 'none'; clearInterval(tmr); return;
    }
    const oldNotice = $('trackConnectionNotice'); if (oldNotice) oldNotice.remove();
    const S = ['تم تسجيل طلبك', 'جاري التجهيز في المطبخ', 'جاهز ومع المشرف', 'اتعيّن لك طيار', 'الطيار خرج لك', 'تم التسليم'];
    const idx = j.status === 'delivered' ? 5 : j.status === 'out' ? 4 : j.pilot_name ? 3 : (j.stage === 'kitchen_ready' || j.stage === 'supervisor_received') ? 2 : 1;
    let h = '<div class="card"><b style="font-size:20px">طلب رقم #' + esc(j.order_no) + '</b>';
    if (j.status === 'failed') h += '<div class="msg e" style="margin-top:10px">تعذر توصيل الطلب، هيتواصل معاك فريق الخدمة.</div>';
    else if (j.status === 'cancelled') h += '<div class="msg e" style="margin-top:10px">تم إلغاء الطلب.</div>';
    else h += S.map((t, i) => '<div class="od" style="margin-top:8px;opacity:' + (i <= idx ? 1 : .45) + '"><span>' + (i < idx ? '✓ ' : i === idx ? '● ' : '○ ') + t + '</span>' + (i === 4 && j.out_at ? '<span class="meta">' + tm(j.out_at) + '</span>' : i === 5 && j.delivered_at ? '<span class="meta">' + tm(j.delivered_at) + '</span>' : '') + '</div>').join('');
    h += '</div>';
    if (j.pilot_name && j.status !== 'failed' && j.status !== 'cancelled') h += '<div class="card"><div class="meta">الطيار</div><b style="font-size:20px">' + esc(j.pilot_name) + '</b>' + (j.pilot_phone ? '<div style="margin-top:8px"><a href="tel:' + esc(j.pilot_phone) + '" style="color:#4e2c12;font-weight:700;font-size:18px" dir="ltr">' + esc(j.pilot_phone) + '</a> <span class="meta">(اضغط للاتصال)</span></div>' : '') + '</div>';
    box.innerHTML = h;
    const m = $('tmap');
    if (j.lat != null) {
      m.style.display = 'block';
      if (!mapT) { mapT = L.map('tmap').setView([j.lat, j.lng], 15); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapT); mk = L.marker([j.lat, j.lng], { icon: bikeIcon(0, true, 72), keyboard: false }).addTo(mapT); lastTrackPos = {lat:j.lat,lng:j.lng}; }
      else { const nextPos = {lat:j.lat,lng:j.lng}; const bearing = bikeBearing(lastTrackPos, nextPos); mk.setLatLng([j.lat, j.lng]); mk.setIcon(bikeIcon(bearing, true, 72)); mapT.panTo([j.lat, j.lng]); lastTrackPos = nextPos; }
    } else m.style.display = 'none';
    if (j.status === 'delivered') {
      m.style.display = 'none';
      if (mapT) { mapT.remove(); mapT = null; mk = null; lastTrackPos = null; }
      const already = j.rated === true;
      if (already) {
        box.innerHTML += '<div class="card"><h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييمك بنجاح.</div></div>';
      } else {
        box.innerHTML += `<div class="card" id="ratingCard"><h2>⭐ قيّم تجربتك مع واحة اليمن</h2><div class="meta">يسعدنا نعرف رأيك بعد استلام طلبك.</div>
          <label>تقييم الطيار</label><div class="rateRow" data-rate="delivery">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم المطعم</label><div class="rateRow" data-rate="restaurant">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم موظف متابعة الكول سنتر</label><div class="rateRow" data-rate="callcenter">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تعليقك (اختياري)</label><textarea id="rateComment" maxlength="1000" placeholder="اكتب ملاحظاتك هنا"></textarea>
          <button class="p big" id="sendRating">إرسال التقييم</button><div id="rateMsg" class="meta"></div></div>`;
        const scores={delivery:0,restaurant:0,callcenter:0};
        document.querySelectorAll('.rateRow').forEach(row=>row.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const key=row.dataset.rate;scores[key]=Number(btn.dataset.v);row.querySelectorAll('button').forEach(b=>b.textContent=Number(b.dataset.v)<=scores[key]?'★':'☆');}));
        $('sendRating').onclick=async()=>{if(!scores.delivery||!scores.restaurant||!scores.callcenter){$('rateMsg').textContent='من فضلك قيّم الأقسام الثلاثة';return;}
          $('sendRating').disabled=true;$('rateMsg').textContent='جارٍ إرسال تقييمك...';
          try {
            const {data,error}=await safeRpc('dlv_submit_customer_rating',{p_code:code,p_delivery:scores.delivery,p_restaurant:scores.restaurant,p_callcenter:scores.callcenter,p_comment:$('rateComment').value||null});
            if(error){$('sendRating').disabled=false;$('rateMsg').textContent=error.message;return;}
            if(data?.rate_limited){$('sendRating').disabled=false;$('rateMsg').textContent=data.message||'محاولات كثيرة. حاول مرة أخرى بعد دقيقة';return;}
            if(data?.already_rated){$('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييم هذا الطلب من قبل.</div>';return;}
            if(data?.success!==true){$('sendRating').disabled=false;$('rateMsg').textContent=data?.message||'لم نتمكن من حفظ التقييم. حاول مرة أخرى.';return;}
            $('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">وصل تقييمك لصاحب النظام وفريق متابعة الكول سنتر.</div>';
          } catch(e) {
            $('sendRating').disabled=false;
            $('rateMsg').textContent='تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.';
          }
        };
      }
      clearInterval(tmr);
    }
  }
  $('tg').onclick = () => { clearInterval(tmr); go(); tmr = setInterval(go, 15000); };
  if (code0) $('tg').onclick();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const _t = new URLSearchParams(location.search).get('t'); if (_t !== null) trackView(_t); else boot();
</script>
