:root{--bg:#101114;--card:#1b1d20;--text:#f7f0df;--muted:#d8cbb5;--line:#a77d3e;--brand:#a77d3e;--gold:#c69b53}

/* Fast, accessible interactions: transform/opacity only; no layout animations */
button,a,input,select{transition:background-color .14s ease,border-color .14s ease,opacity .14s ease,transform .14s ease}
button:not(:disabled):active{transform:scale(.985)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #eac27b;outline-offset:2px}
@media(prefers-reduced-motion:reduce){button,a,input,select{transition:none!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:12px 0;position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#4e2c12;color:#f4e9d2;border-radius:16px;padding:10px 12px;border-bottom:3px solid #b9832e}
header h1{font-size:16px;margin:0;flex:1}header small{display:block;color:#e0cba6;font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button,input,select,textarea{font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;width:100%}
button{width:auto;cursor:pointer;font-weight:600}
button.p{background:var(--brand);color:#fff;border-color:var(--brand)}
button.g{background:var(--gold);color:#fff;border-color:var(--gold)}
button.r{color:#e03131;border-color:#e03131}
button:disabled{opacity:.5}
.big{width:100%;padding:14px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.badge{font-size:11px;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
.late{color:#e03131;font-size:12px;font-weight:700}
.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.ord{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-weight:600}
.msg{padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}
.msg.e{background:#ffe3e3;color:#c92a2a}.msg.o{background:#d3f9d8;color:#2b8a3e}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
.modal label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.hide{display:none}.grow{flex:1;min-width:0}h2{font-size:14px;margin:12px 0 6px}body{min-height:100vh}body::before{content:"";position:fixed;inset:0;background:none;opacity:0;pointer-events:none;z-index:0}@media print{body>*:not(#rpt){display:none!important}body::before{display:none}#rpt{position:static!important;overflow:visible!important;background:#fff!important}.noprint{display:none!important}}.leaflet-container{font:inherit}.leaflet-popup-content{direction:rtl;text-align:right}
.ys-bike-marker{background:transparent!important;border:0!important;overflow:visible!important}.ys-bike-marker div{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ys-bike-marker{background:transparent!important;border:0!important;overflow:visible!important}
.ys-bike-pin{position:relative;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 5px 9px rgba(25,15,8,.35))}
.ys-bike-core{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#8c2420,#54100f);border:3px solid #e7c477;box-shadow:inset 0 0 0 2px rgba(255,244,218,.22),0 0 0 3px rgba(123,23,23,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.ys-bike-crown{font-size:7px;font-weight:900;letter-spacing:.1px;color:#f5d995;line-height:9px;margin-top:2px}
.ys-bike-core svg{display:block;margin-top:-1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.ys-bike-status{position:absolute;right:2px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--bike-status);border:2px solid #fff;z-index:3}
.ys-bike-pulse{position:absolute;inset:2px;border:2px solid var(--bike-status);border-radius:50%;opacity:.55;animation:ysBikePulse 2s ease-out infinite}
@keyframes ysBikePulse{0%{transform:scale(.82);opacity:.65}100%{transform:scale(1.35);opacity:0}}
.ys-map-shell{background:#f7f4ed;border-top:1px solid #d8c59c}
.ys-map-head{background:linear-gradient(110deg,#4d100f,#7b1717 65%,#9a3027);color:#fff;padding:12px 14px;box-shadow:0 3px 12px #32100e33}
.ys-map-head .meta{color:#f4dfb4!important}
.ys-map-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#fffaf0;color:#55351f;font-size:12px;border-top:1px solid #e7d8b8}
.ys-map-legend span{display:inline-flex;align-items:center;gap:5px}
.ys-map-dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid #fff;box-shadow:0 0 0 1px #aaa}
.leaflet-popup-content-wrapper{border-radius:14px!important;border:1px solid #d8b76e;box-shadow:0 8px 24px #24140f33!important}
.leaflet-popup-content{margin:12px 15px!important;line-height:1.8!important}
.leaflet-control-zoom a{color:#6b1717!important}

.rateRow{display:flex;gap:8px;margin:6px 0 14px;direction:ltr}.rateStar{font-size:30px;color:#b8862b;background:#fff8e8;border:1px solid #d9b36a;border-radius:10px;padding:2px 9px;min-width:42px}.rateRow .rateStar:focus{outline:2px solid #7b1717}

.pilot-contact-card{border:1px solid #dcc49a;background:linear-gradient(135deg,#fff8ea,#f5e5c9)}
.pilot-contact-actions{display:flex;gap:10px;margin-top:12px;direction:rtl}
.pilot-contact-btn{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:46px;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:800;font-size:15px;border:1px solid #b9832e;box-sizing:border-box}
.pilot-call{background:#5a3317;color:#fff8ea}
.pilot-wa{background:#b9832e;color:#fff}
.pilot-disabled{background:#eee5d7;color:#8d806f;border-color:#d8cbb6;opacity:.8}
 .ys-rider-photo{overflow:hidden;background:#f9d49b;border:3px solid #6b3514;display:grid;place-items:center}.ys-rider-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.ys-bike-pin{isolation:isolate}

.ys-motorcycle-marker,.ys-motorcycle-icon{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}.ys-motorcycle-icon img{border:0!important;border-radius:0!important;background:transparent!important}

/* Authenticated company theme: consistent contrast on mobile and desktop */
body.ys-tenant{--text:var(--ys-on-card);--muted:var(--ys-muted-card);--line:var(--gold);background:var(--bg)!important;color:var(--text)!important}
body.ys-tenant::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--tenant-wallpaper,none)!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;opacity:.13!important}
body.ys-tenant::after{content:"";display:block!important;position:fixed;inset:0;pointer-events:none;z-index:0;background-image:var(--tenant-logo,none)!important;background-size:min(68vw,340px) auto!important;background-position:center 48%!important;background-repeat:no-repeat!important;opacity:.3!important}
body.ys-tenant .wrap,body.ys-tenant #app{position:relative;z-index:1}
body.ys-tenant .card,body.ys-tenant .stat,body.ys-tenant .modal>div{background:#211c1b!important;color:#fff5e3!important;border-color:#b78b50!important}
body.ys-tenant .meta,body.ys-tenant .stat span,body.ys-tenant th{color:#e6d4b8!important}
body.ys-tenant h1,body.ys-tenant h2,body.ys-tenant h3,body.ys-tenant .ord,body.ys-tenant .stat b{color:#fff5e3!important}
body.ys-tenant header{background:#4e2c12!important;border-color:#d5a65a!important;color:#fff5e3!important}
body.ys-tenant button,body.ys-tenant input,body.ys-tenant select,body.ys-tenant textarea{color:#fff5e3;background:#30251d;border-color:#b78b50}
body.ys-tenant button.p{background:#8b4c1e;color:#fff;border-color:#d5a65a}
body.ys-tenant button.g{background:#94651d;color:#fff}
body.ys-tenant .msg.e{background:#552520;color:#ffe6e2}
body.ys-tenant .msg.o{background:#1b4b33;color:#e0ffe8}
@media print{body.ys-tenant::before{display:none!important}}
/* Your Staff neutral wallpaper: public, owner and branch selection only */
html.ys-public body,body.ys-platform{background:#101827!important;background-image:radial-gradient(ellipse at 15% 10%,rgba(216,174,100,.13),transparent 48%),radial-gradient(ellipse at 85% 90%,rgba(75,113,151,.16),transparent 50%)!important}
html.ys-public body::after,body.ys-platform::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.09;background-image:url("yourstaff-icon.svg");background-repeat:no-repeat;background-size:min(72vw,360px) auto;background-position:center 45%}
html.ys-public .wrap,body.ys-platform .wrap{position:relative;z-index:1}
html.ys-public header,body.ys-platform header{background:#172235;border-bottom-color:#d8ae64}
html.ys-public .card,body.ys-platform .card{background:rgba(27,35,49,.95);border-color:#6c604e}
html.ys-public button.p,body.ys-platform button.p{background:#a77d3e;border-color:#a77d3e;color:#fff}
/* Visible platform mark on the owner/company selector */
body.ys-platform:not(.ys-tenant)::after{display:block!important;content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("yourstaff-icon.svg")!important;background-size:min(70vw,360px) auto!important;background-position:center 54%!important;background-repeat:no-repeat!important;opacity:.16!important}
body.ys-platform:not(.ys-tenant) #app{position:relative;z-index:1}
.ys-platform-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 22px}
.ys-platform-brand img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 6px 16px #0008)}
.ys-partners-title{margin:22px 0 12px;font-size:15px;color:#eebc62;font-weight:700;text-align:right}
/* Your Staff branded public entrance: independent of every tenant */
html.ys-public body.ys-platform{background:radial-gradient(ellipse 75% 36% at 50% 8%,rgba(198,155,83,.18),transparent 80%),linear-gradient(155deg,#0e1727 0%,#111827 45%,#090f1a 100%)!important;background-attachment:fixed!important}
html.ys-public body.ys-platform::after{background-image:url("yourstaff-icon.svg")!important;background-size:min(64vw,280px) auto!important;background-position:center 46%!important;opacity:.075!important}
html.ys-public body.ys-platform .card{background:rgba(18,26,40,.92)!important;box-shadow:0 20px 65px rgba(0,0,0,.38),0 0 0 1px rgba(213,170,98,.16);backdrop-filter:blur(8px)}
html.ys-public body.ys-platform #publicPartners .ys-partner-logo{width:76px;height:76px;object-fit:contain;border-radius:14px;background:#fff;padding:7px;box-shadow:0 3px 14px #0005}
@media(max-width:480px){html.ys-public body.ys-platform .card{margin:16px auto!important}}
/* Your Staff public and platform-owner surfaces: never inherit tenant wallpaper */
body.ys-platform,html.ys-public body{background:#101114!important;color:#f7f0df!important}
body.ys-platform::before,html.ys-public body::before{background:none!important;opacity:0!important}
body.ys-platform .card{background:#1b1d20;color:#f7f0df;border:1px solid #a77d3e}
body.ys-platform input{background:#fff;color:#161616}
body.ys-platform .meta{color:#d8cbb5}

@media(max-width:600px){#nw,.acts button,.modal button.p{min-height:48px}#cc_q{min-height:48px}details.card>summary{min-height:32px;display:flex;align-items:center}}

.ys-role-guide{border-inline-start:4px solid var(--gold);padding:12px 16px;background:var(--card);border-radius:12px;margin-bottom:12px}
.ys-role-guide strong{display:block;margin-bottom:5px}.ys-stage-clock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;font-size:13px;line-height:1.6}.ys-stage-clock[data-level="warning"]{border-color:#e4b54e;background:#805b151f}.ys-stage-clock[data-level="late"]{border-color:#ef806d;background:#ae382021}.ys-stage-clock b{font-variant-numeric:tabular-nums}.ys-complaint-status{font-weight:700}.acts{flex-wrap:wrap}.acts button{min-width:100px}@media(max-width:600px){.ys-role-guide{padding:12px}.ys-stage-clock{font-size:12px}.modal>div{padding-bottom:24px}}
@media print{#rpt .card,#rpt .stat{background:#fff!important;color:#111!important;border-color:#aaa!important;box-shadow:none!important}#rpt .meta,#rpt .stat span,#rpt h2{color:#333!important}#rpt .ord{break-inside:avoid}#rpt .grid{grid-template-columns:repeat(3,1fr)}}

/* Persistent platform clock: shared by all tenants and screens. */
#ys-live-clock{position:relative;z-index:1;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;min-height:38px;padding:7px 12px;background:#121b2a;color:#f7f2e7;border-bottom:1px solid #b68a47;font:600 13px/1.5 system-ui,sans-serif;direction:rtl;font-variant-numeric:tabular-nums;box-shadow:0 2px 12px #0002}
#ys-live-clock .ys-clock-time{color:#f2cb7c;font-weight:800;font-size:15px;direction:ltr;unicode-bidi:isolate}
#ys-live-clock .ys-clock-zone{font-size:11px;opacity:.78}
body.ys-tenant #ys-live-clock{background:var(--card,#1b1d20);border-bottom-color:var(--brand,#a77d3e);color:var(--gold,#c69b53);box-shadow:none}
body.ys-tenant #ys-live-clock .ys-clock-time{color:var(--gold,#c69b53)}
body.ys-tenant #ys-live-clock .ys-clock-zone{color:var(--gold,#c69b53);opacity:1}

/* Compact, accessible operational controls across mobile and desktop */
.ys-operations-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:12px}
.ys-operations-bar button{min-height:42px;padding:8px 12px;margin-inline-start:auto}
.ys-operations-bar small{color:var(--muted);font-size:11px}
.ys-connection{font-size:12px;font-weight:700}
.ys-connection.online{color:#81d5a2}
.ys-connection.offline{color:#ffb18a}
@media(max-width:520px){.ys-operations-bar button{width:100%;margin-inline-start:0}.ys-operations-bar small{width:100%}}
.ys-guide-highlight{outline:3px solid var(--gold)!important;outline-offset:4px;box-shadow:0 0 0 7px rgba(198,155,83,.16)!important}
.ys-role-guide button{min-height:44px}
@media(max-width:520px){.ys-role-guide .row button{width:100%}}

/* Responsive operational layout, shared by all roles. */
:root{--ys-on-card:#f7f0df;--ys-muted-card:#d8cbb5;--ys-header-bg:#4e2c12;--ys-on-header:#fff5e3;--ys-on-brand:#fff;--ys-on-gold:#17130c}
body{line-height:1.65;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{max-width:1180px;padding-block:16px}

#app h1{font-size:clamp(21px,3vw,28px)}

#app label{display:block;line-height:1.6;font-size:14px;font-weight:600;margin:12px 0 6px}
#app .meta{font-size:13px;line-height:1.85}
#app .f{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;margin-bottom:16px}
#app :is(.grid,.f)>*{min-width:0;max-width:100%}

function ysThemeColors(config){

const stageSlaCache=new Map();
function stageClockState(o,sla={},now=Date.now()){
 if(!['new','received','out'].includes(o.status))return null;
 let label='المطبخ',start=o.kitchen_received_at||o.created_at,limit=Number(sla.kitchen_minutes)||25;
 if(o.status==='out'){label='التوصيل';start=o.out_at||o.received_at||o.created_at;limit=Number(sla.delivery_minutes)||60;}
 else if(o.status==='received'||o.workflow_stage==='driver_assigned'){label='خروج الطيار';start=o.received_at||o.pilot_assigned_at||o.created_at;limit=Number(sla.dispatch_minutes)||20;}
 else if(['kitchen_ready','supervisor_received'].includes(o.workflow_stage)){label='إسناد الطيار';start=o.kitchen_ready_at||o.supervisor_received_at||o.created_at;limit=Number(sla.dispatch_minutes)||20;}
 const parsed=Date.parse(start);if(!Number.isFinite(parsed))return null;
 const elapsed=Math.max(0,Math.floor((now-parsed)/60000)),remaining=limit-elapsed;
 return {label,start:parsed,limit,elapsed,remaining,level:remaining<0?'late':remaining<=5?'warning':'normal'};
}
function stageClockHtml(o){

}
function updateStageClocks(){

 const sla=stageSlaCache.get(Number(el.dataset.stageBranch));const limit=Number(sla?.[el.dataset.stageKind]||el.dataset.stageLimit);
 const elapsed=Math.max(0,Math.floor((Date.now()-Number(el.dataset.stageStart))/60000)),remaining=limit-elapsed;
 el.dataset.level=remaining<0?'late':remaining<=5?'warning':'normal';
 const value=remaining<0?'متأخر '+Math.abs(remaining)+' دقيقة':remaining===0?'وصل للحد المحدد':'متبقي '+remaining+' دقيقة';const target=el.querySelector('[data-stage-value]');if(target.textContent!==value)target.textContent=value;
 if(sla){const source=el.querySelector('[data-stage-source]'),text='مدة المرحلة '+elapsed+' / '+limit+' دقيقة';if(source.textContent!==text)source.textContent=text;}
 });
}

  branchNames[Number(branch.id)]=result.data.name;overlay.remove();
  await ownerBranchPicker(Number(companyId));

 };

  if(!branches.length)return alert('أضف فرعًا أولًا حتى تتمكن من إدارة ميزاته.');
  const choice=prompt('اختر رقم الفرع لإدارة ميزاته الإضافية:\\n'+options);if(choice===null)return;
  const branchId=Number(choice);
  if(!branches.some(b=>Number(b.id)===branchId))return alert('رقم الفرع غير صحيح.');
  const result=await safeRpc('dlv_owner_list_branch_addons',{p_branch_id:branchId});
  if(result.error)return alert('تعذر تحميل الميزات: '+result.error.message);
  const rows=result.data||[];
  const available=rows.filter(x=>x.implemented);
  const menu=rows.map((x,i)=>(i+1)+'. '+x.title_ar+' — '+(!x.implemented?'قيد التطوير':x.enabled?'مفعلة':'جاهزة للتفعيل')).join('\\n');
  const action=prompt('الميزات الإضافية لفرع '+(branches.find(b=>Number(b.id)===branchId)?.name||'')+'\\n\\n'+menu+'\\n\\nاكتب رقم الميزة الجاهزة لتفعيلها أو إيقافها، أو اكتب تقرير لنتائج التقييمات، أو مطبخ لتقرير أداء المطبخ، أو إدارة لتشغيل الميزات الأخرى:');
  if(action===null)return;
  if(action.trim()==='إدارة'){
    const active=rows.filter(x=>x.enabled&&x.implemented&&x.code!=='customer_ratings'&&x.code!=='advanced_kitchen');
    if(!active.length)return alert('فعّل ميزة إضافية أولًا.');
    const choice=prompt('اختر رقم الميزة لإدارتها:\\n'+active.map((x,i)=>(i+1)+'. '+x.title_ar).join('\\n'));
    if(choice===null)return;
    const item=active[Number(choice)-1];if(!item)return alert('اختيار غير صحيح');
    let operation='report',payload={};
    if(item.code==='profit_reports'){
      const k=prompt('اكتب تقرير أو إيراد أو مصروف');if(k===null)return;
      if(k==='إيراد'||k==='مصروف'){operation='add';payload.kind=k==='إيراد'?'revenue':'expense';payload.amount=prompt('القيمة المالية');if(payload.amount===null)return;payload.note=prompt('ملاحظة اختيارية')||'';}
      else if(k!=='تقرير')return alert('اختيار غير صحيح');
    }else if(item.code==='digital_menu'){
      const k=prompt('اكتب تقرير أو إضافة');if(k===null)return;
      if(k==='إضافة'){operation='add';payload.name=prompt('اسم الصنف');if(payload.name===null)return;payload.price=prompt('السعر');if(payload.price===null)return;}
      else if(k!=='تقرير')return alert('اختيار غير صحيح');
    }else if(item.code==='vip_customers'){
      const k=prompt('اكتب تقرير أو إضافة');if(k===null)return;
      if(k==='إضافة'){operation='add';payload.phone=prompt('رقم العميل');if(payload.phone===null)return;payload.note=prompt('ملاحظة الخدمة')||'';}
      else if(k!=='تقرير')return alert('اختيار غير صحيح');
    }else if(item.code==='driver_shifts'){
      const k=prompt('اكتب تقرير أو بداية أو نهاية');if(k===null)return;
      if(k==='بداية'||k==='نهاية'){operation=k==='بداية'?'start':'end';payload.driver_id=prompt('معرف الطيار UUID من سجل الموظفين');if(payload.driver_id===null)return;}
      else if(k!=='تقرير')return alert('اختيار غير صحيح');
    }
    const response=await safeRpc('dlv_owner_addon_action',{p_branch_id:branchId,p_code:item.code,p_action:operation,p_payload:payload});
    if(response.error)return alert('تعذر تنفيذ العملية: '+response.error.message);
    const data=response.data;
    if(item.code==='vip_customers')return alert('عدد عملاء VIP: '+(data?.vip_count??0));
    if(item.code==='profit_reports')return alert('الإيرادات: '+data.revenue+'\\nالمصروفات: '+data.expenses+'\\nالصافي: '+data.net);
    if(item.code==='driver_shifts')return alert('الشيفتات المفتوحة: '+data.open_shifts+'\\nإجمالي الشيفتات: '+data.total_shifts);
    if(item.code==='restaurant_owner')return alert('طلبات آخر 30 يوم: '+data.orders_30d+'\\nتم التسليم: '+data.delivered_30d+'\\nبدون طيار: '+data.unassigned);
    if(item.code==='digital_menu')return alert('أصناف المنيو:\\n'+(data||[]).map(x=>x.name+' — '+x.price).join('\\n').slice(0,3500));
    if(item.code==='smart_dispatch')return alert('الطيارون المتاحون للمراجعة:\\n'+(data||[]).map(x=>x.name+' — طلبات مفتوحة: '+x.open_orders+' — آخر GPS: '+(x.gps_updated_at||'غير متاح')).join('\\n').slice(0,3500));
    alert('تمت العملية');
    return;
  }
  if(action.trim()==='مطبخ'){
    const report=await safeRpc('dlv_owner_branch_kitchen_summary',{p_branch_id:branchId});
    if(report.error)return alert('تعذر عرض تقرير المطبخ: '+report.error.message);
    const x=(report.data||[])[0]||{};
    return alert('تقرير المطبخ — آخر 30 يوم\\nإجمالي الطلبات: '+Number(x.total_orders||0)+'\\nاستلمها المطبخ: '+Number(x.received_by_kitchen||0)+'\\nتم تجهيزها: '+Number(x.ready_orders||0)+'\\nمتوسط التجهيز بالدقائق: '+(x.avg_prep_minutes??'لا توجد بيانات')+'\\nتجاوزت 30 دقيقة: '+Number(x.over_30_min||0));
  }
  if(action.trim()==='تقرير'){
    const report=await safeRpc('dlv_owner_branch_rating_summary',{p_branch_id:branchId});
    if(report.error)return alert('تعذر عرض التقرير: '+report.error.message);
    const x=(report.data||[])[0]||{};
    return alert('تقرير تقييمات الفرع\\nعدد التقييمات: '+Number(x.total_ratings||0)+'\\nمتوسط التوصيل: '+(x.avg_delivery??'لا توجد تقييمات')+'\\nمتوسط المطعم: '+(x.avg_restaurant??'لا توجد تقييمات')+'\\nمتوسط الكول سنتر: '+(x.avg_callcenter??'لا توجد تقييمات'));
  }
  const index=Number(action)-1;
  if(!Number.isInteger(index)||index<0||index>=rows.length)return alert('اختيار غير صحيح.');
  const item=rows[index];
  if(!item.implemented)return alert('هذه الميزة لم يكتمل تنفيذها بعد، ولا يمكن تفعيلها.');
  if(!confirm((item.enabled?'إيقاف':'تفعيل')+' ميزة '+item.title_ar+' لهذا الفرع فقط؟'))return;
  const change=await safeRpc('dlv_owner_set_branch_addon',{p_branch_id:branchId,p_code:item.code,p_enabled:!item.enabled});
  if(change.error)return alert('تعذر حفظ الميزة: '+change.error.message);
  alert('تم '+(item.enabled?'إيقاف':'تفعيل')+' '+item.title_ar+' لهذا الفرع. '+(!item.enabled?'استخدم زر الميزات مرة أخرى واكتب تقرير للتقييمات أو مطبخ لأداء المطبخ.':''));
 };
 $('ownerEditCompanyBrand').onclick=async()=>{
  if(!isOwner())return flash('هذه الخاصية لمالك المنصة فقط',false);
  const fileInput=document.createElement('input');
  fileInput.type='file';fileInput.accept='image/png,image/jpeg,image/webp';fileInput.style.display='none';
  document.body.appendChild(fileInput);
  fileInput.onchange=async()=>{
   const file=fileInput.files?.[0];fileInput.remove();if(!file)return;
   if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024||file.size===0)return flash('اختار PNG أو JPG أو WEBP بحجم لا يتجاوز 5 ميجابايت',false);
   const company=Number(companyId),button=$('ownerEditCompanyBrand');
   if(button){button.disabled=true;button.textContent='⏳ جاري رفع شعار الشركة...';}
   try{
    const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1];
    const path='companies/'+company+'/logo-'+crypto.randomUUID()+'.'+ext;
    const uploaded=await sb.storage.from('brand-assets').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'3600'});
    if(uploaded.error)throw uploaded.error;
    const url=sb.storage.from('brand-assets').getPublicUrl(path).data.publicUrl;
    const {data,error}=await sb.from('dlv_company_branding').update({logo_url:url,background_url:url,updated_at:new Date().toISOString()}).eq('company_id',company).select().single();
    if(error)throw error;
    ownerBrandCache.set(company,data);tenantBrandCache.set(company,data);
    applyBrandConfig(data,true);
    flash('تم حفظ الشعار وتطبيقه على الشركاء وخلفيات فروع الشركة',true);
    await ownerBranchPicker(company);
   }catch(e){flash('تعذر رفع شعار الشركة: '+(e.message||'خطأ غير معروف'),false);}
   finally{if(button&&button.isConnected){button.disabled=false;button.textContent='🎨 الهوية';}}
  };
  fileInput.oncancel=()=>fileInput.remove();
  fileInput.click();
 };

async function enterOwnerDashboard(){
 document.documentElement.classList.remove('ys-public'); document.body.classList.remove('ys-platform');
 if(!Number.isInteger(Number(ownerActiveCompanyId))||Number(ownerActiveCompanyId)<1)return ownerCompanyPicker();
 const selectedCompanyBrand=ownerBrandCache.get(Number(ownerActiveCompanyId));
 if(selectedCompanyBrand)applyBrandConfig(selectedCompanyBrand,true);
 else {
  const brandLookup=await sb.from('dlv_company_branding').select('*').eq('company_id',Number(ownerActiveCompanyId)).maybeSingle();
  if(brandLookup.error||!brandLookup.data)return reconnectView('تعذر تحميل هوية الشركة؛ لن نعرض شعار شركة أخرى بدلًا منها.');
  ownerBrandCache.set(Number(ownerActiveCompanyId),brandLookup.data);
  applyBrandConfig(brandLookup.data,true);
 }

  const branchQuery=await safeRpc('dlv_owner_company_branches',{p_company_id:Number(ownerActiveCompanyId)});
  if(branchQuery.error)return reconnectView('تعذر التحقق من فروع الشركة الحالية.');
  const scopedIds=[...new Set((branchQuery.data||[]).map(b=>Number(b.id)).filter(x=>Number.isInteger(x)&&x>0))];
  if(selectedBranch && !scopedIds.includes(Number(selectedBranch))){selectedBranch=null;return ownerBranchPicker(Number(ownerActiveCompanyId));}
  if(!scopedIds.length){drivers=[];if(selectedBranch){selectedBranch=null;return ownerBranchPicker(Number(ownerActiveCompanyId));}}

  else {
   const r=await sb.from('dlv_profiles').select('user_id,full_name,employee_code,branch_id').eq('role','driver').eq('active',true).in('branch_id',selectedBranch?[Number(selectedBranch)]:scopedIds).order('full_name');
   if(r.error){console.warn('تعذر تحميل الطيارين:',r.error.message);drivers=[];}
   else drivers=r.data||[];
  }
  managerView(); startKitchenDelayMonitor();
  startOrderRealtime();
}

async function refreshKitchenDelayNotices() {
 const stillCurrent=captureOperationalRead('refreshKitchenDelayNotices','delayNotices');if(!stillCurrent())return;
  if (!me) return;
  const {data,error} = await safeRpc('dlv_list_stage_notifications');if(!stillCurrent())return;
  const box = $('delayNotices'); if (!box) return;
  if (error) { box.innerHTML = '<div class="msg e">تعذر تحميل التنبيهات: '+esc(error.message)+'</div>'; return; }
  // قراءة التنبيه لا تعني تسجيل إجراء لحل التأخير؛ الإجراء يُحفظ مستقلًا.
  const rows = (data || []).filter(n => !n.read_at && (n.notification_type === 'kitchen_delay' || String(n.notification_type||'').startsWith('stage_') || !n.notification_type));
  box.innerHTML = rows.length ? '<section class="card" style="border:1px solid #e8590c;background:#fff4e6"><div class="ord"><b>🔔 تنبيهات تحتاج متابعة</b><span class="badge" style="background:#e8590c">'+rows.length+' جديد</span></div>' + rows.map(n => '<div class="msg e" style="margin-top:8px"><b>'+esc(n.title)+'</b><br>'+esc(n.body)+(String(n.notification_type||'').startsWith('stage_')?'<div><button onclick="recordOrderDelay('+Number(n.order_id)+')">تسجيل إجراء</button></div>':'')+'<div class="meta">'+tm(n.created_at)+'</div><button data-delay-read="'+n.id+'" style="margin-top:6px">✓ قرأت التنبيه</button></div>').join('')+'</section>' : '';
  box.querySelectorAll('[data-delay-read]').forEach(b => b.onclick = async () => { if (!requireOnline('تحديث التنبيه')) return; b.disabled=true; const {error}=await safeRpc('dlv_mark_notification_read',{p_id:Number(b.dataset.delayRead)});if(!stillCurrent())return; if(error){b.disabled=false;return flash('تعذر حفظ قراءة التنبيه',false);} refreshKitchenDelayNotices(); });
}
async function runKitchenDelayCheck() {
  if (!me) return;
  const {error} = await safeRpc('dlv_check_kitchen_delays');
  if (error) console.warn('Kitchen delay check:', error.message);
  await refreshKitchenDelayNotices();
}
function startKitchenDelayMonitor() {
  clearInterval(delayTimer);
  if (!me) return;
  runKitchenDelayCheck();
  delayTimer = setInterval(runKitchenDelayCheck, 60000);
}

async function openCompanyAppearance(){
 if(!OWNER_ONLY())return;
 const companyId=Number(ownerActiveCompanyId),epoch=appSessionEpoch;
 if(!Number.isInteger(companyId)||companyId<1)return flash('اختر الشركة أولًا',false);
 const {data,error}=await sb.from('dlv_company_branding').select('*').eq('company_id',companyId).single();
 if(epoch!==appSessionEpoch||!isOwner()||Number(ownerActiveCompanyId)!==companyId)return;
 if(error)return flash('تعذر تحميل إعدادات مظهر الشركة',false);
 YourStaffAppearance.open({config:data.appearance||{},brand:data,onSave:async appearance=>{
  if(epoch!==appSessionEpoch||!isOwner()||Number(ownerActiveCompanyId)!==companyId)throw Error('أعد فتح الشركة وقفل المالك قبل الحفظ');
  const result=await sb.from('dlv_company_branding').update({appearance,updated_at:new Date().toISOString()}).eq('company_id',companyId).select('*').single();
  if(result.error)throw Error('تعذر الحفظ. تحقق من الاتصال وأن قفل صفحة المالك ما زال مفتوحًا.');
  if(epoch!==appSessionEpoch||!isOwner()||Number(ownerActiveCompanyId)!==companyId)throw Error('تغيرت الشركة أو انتهت الجلسة؛ افتح إعدادات الشركة مجددًا');
  ownerBrandCache.set(companyId,result.data);tenantBrandCache.set(companyId,result.data);applyBrandConfig(result.data,true);
  return result.data.appearance;
 }});
}

function deliveryDigits(value){
 return String(value??'').replace(/[٠-٩۰-۹]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.includes(c)?'٠١٢٣٤٥٦٧٨٩'.indexOf(c):'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)));
}
function deliveryMobile(value){
 const raw=deliveryDigits(value).trim();if(!raw)return '';
 const digits=raw.replace(/\D/g,'');
 const phone=digits.startsWith('0')?'20'+digits.slice(1):digits;
 return /^20(?:10|11|12|15)\d{8}$/.test(phone)?phone:null;
}
function orderSearchTerm(value){
 return deliveryDigits(value).normalize('NFKC').replace(/[^\p{L}\p{N}\s-]/gu,'').trim().slice(0,60);
}
async function safeRpc(name, args) {
  try {
    const result = await sb.rpc(name, args);
    return result || { data: null, error: { message: 'لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة.' } };
  } catch (err) {
    const message = err && err.message ? err.message : 'تعذر الاتصال بالخادم. لم يتم تأكيد حفظ العملية.';
    return { data: null, error: { message } };
  }
}
function requireOnline(action='تنفيذ العملية') {
  if (navigator.onLine) return true;
  flash(`لا يمكن ${action} بدون اتصال بالإنترنت. لم يتم حفظ أي تغيير؛ أعد المحاولة بعد عودة الاتصال.`, false);
  return false;
}
const orderStatusPending=new Set();
async function setStatus(id, to, note) {
  if (!requireOnline('تغيير حالة الطلب')) return;
  if(orderStatusPending.has(id))return;
  orderStatusPending.add(id);
  try{
   const {error} = await safeRpc('dlv_set_status', {p_id: id, p_to: to, p_note: note || null});
   if (error) {flash(error.message, false);refreshView();return;}
   flash('تم التحديث', true);refreshView();
  }finally{orderStatusPending.delete(id);}
}

 const reasonsHtml=reasonsResult.error?'<div>تعذر تحميل الأسباب المسجلة</div>':(reasonsResult.data||[]).map(x=>'<div class="ord"><b>'+esc(delayReasons[x.reason]||x.reason)+'</b><span>'+Number(x.count)+' مرة</span></div>').join('')||'<div>لا توجد أسباب مسجلة في اليوم المحدد</div>';

function newOrderForm() {
  const wf = me?.workflow_role || me?.role;
  if (!me || !['callcenter_followup','manager','admin'].includes(wf)) return flash('إنشاء الطلب متاح لمتابعة الكول سنتر والإدارة فقط', false);
  const isMgr = true;
  const d = document.createElement('div'); d.className = 'modal';
  const $=id=>d.querySelector('#'+id);
  let orderSubmitting=false;
  d.innerHTML = `<div><h2 style="font-size:16px">طلب جديد</h2><div id="ferr" class="msg e hide"></div>
    <label>اسم موظف الكول سنتر صاحب الطلب *</label><select id="n_staff"><option value="">اختر الموظف</option></select><div class="meta">مسؤول المتابعة: ${esc(me.full_name||"الحساب الحالي")}</div><label>رقم الطلب *</label><input id="n_no" inputmode="numeric">
    ${(isOwner() || (me.allowed_branch_ids||[]).length>1) ? `<label>الفرع *</label><select id="n_branch" disabled><option value="">جاري تحميل الفروع المصرح بها...</option></select>` : ''}
    ${isMgr ? `<label>اسم العميل</label><input id="n_c"><label>رقم الهاتف</label><input id="n_p" inputmode="tel"><div id="n_customer_count" class="meta" aria-live="polite">رقم الهاتف اختياري — يمكن تسجيل الطلب بدونه.</div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="n_wa_consent" style="width:auto"> العميل وافق على استلام رابط المتابعة عبر واتساب</label>
    <label>العنوان</label><input id="n_a">` : ''}
    ${isMgr ? '<label>ملاحظات</label><textarea id="n_n" rows="2"></textarea>' : ''}
    <div class="row" style="margin-top:14px"><button class="p big" id="n_ok" style="flex:1">تسجيل</button><button class="big" id="n_x" style="flex:0 0 90px">إلغاء</button></div></div>`;
  document.body.appendChild(d);
  let orderBranchesReady=false;
  async function loadOrderBranches(){
    const sel=d.querySelector('#n_branch');
    if(!sel){orderBranchesReady=true;return;}
    const result=isOwner()
      ?await safeRpc('dlv_owner_company_branches',{p_company_id:Number(ownerActiveCompanyId)})
      :await safeRpc('dlv_my_branches');
    if(!d.isConnected)return;
    if(result.error){$('ferr').textContent='تعذر تحميل الفروع: '+result.error.message;$('ferr').className='msg e';sel.innerHTML='<option value="">تعذر تحميل الفروع</option>';return;}
    const branches=(result.data||[]).filter(b=>b.active!==false);
    sel.innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>'<option value="'+Number(b.id)+'">'+esc(b.name)+'</option>').join('');
    const wanted=Number(selectedBranch||me.branch_id);
    if(branches.some(b=>Number(b.id)===wanted))sel.value=String(wanted);
    else if(branches.length===1)sel.value=String(branches[0].id);
    sel.disabled=!branches.length;
    orderBranchesReady=!!branches.length;
    if(!orderBranchesReady){$('ferr').textContent='لا توجد فروع مصرح بها لإنشاء طلب';$('ferr').className='msg e';}
    if(orderBranchesReady)loadOrderStaff();
  }
  let staffRequestId=0;
  let staffBranchReady=0;
  async function loadOrderStaff(){
    const request=++staffRequestId;
    staffBranchReady=0;
    const sel=d.querySelector('#n_staff');
    const branchSelect=d.querySelector('#n_branch');
    const branch=branchSelect?Number(branchSelect.value):Number(selectedBranch||me.branch_id);
    sel.disabled=true;
    sel.innerHTML='<option value="">جاري تحميل الموظفين...</option>';
    if(!Number.isInteger(branch)||branch<1){
      sel.innerHTML='<option value="">اختر فرعًا صحيحًا أولاً</option>';
      return;
    }
    const {data,error}=await safeRpc('dlv_callcenter_staff_list',{p_branch:branch});
    if(!d.isConnected||request!==staffRequestId)return;
    sel.innerHTML='<option value="">اختر الموظف صاحب الطلب</option>'+(data||[]).map(x=>'<option value="'+Number(x.id)+'">'+esc(x.name)+'</option>').join('');
    sel.disabled=!!error||!(data||[]).length;
    if(!error&&(data||[]).length)staffBranchReady=branch;
    if(error){$('ferr').textContent='تعذر تحميل موظفي الفرع: '+error.message;$('ferr').className='msg e';}
    else if(!(data||[]).length){$('ferr').textContent='لا يوجد موظف متابعة كول سنتر مسجل في هذا الفرع';$('ferr').className='msg e';}
  }
  let customerCountRequest=0;
  async function updateCustomerOrderCount(){
    const label=$('n_customer_count'),phone=String($('n_p')?.value||'').trim();
    if(!label)return;
    const request=++customerCountRequest;
    if(!phone){label.textContent='رقم الهاتف اختياري — يمكن تسجيل الطلب بدونه.';return;}
    const normalized=deliveryMobile(phone);
    if(!normalized){label.textContent='أدخل رقم موبايل صحيحًا لعرض عدد الطلبات.';return;}
    label.textContent='جارٍ حساب طلبات العميل...';
    const branch=Number($('n_branch')?.value||selectedBranch||me.branch_id);
    const response=await safeRpc('dlv_customer_order_count',{p_branch_id:branch,p_phone:normalized});
    if(request!==customerCountRequest||!label.isConnected)return;
    if(response.error){label.textContent='تعذر عرض عدد الطلبات حاليًا.';return;}
    const count=Number(response.data||0);
    label.textContent=count?'العميل طلب من هذه الشركة '+count+' مرة سابقًا — الطلب الحالي سيكون رقم '+(count+1):'عميل جديد — لم يُسجّل له طلب سابق في هذه الشركة.';
  }
  if($('n_p')){$('n_p').addEventListener('change',updateCustomerOrderCount);$('n_p').addEventListener('blur',updateCustomerOrderCount);}
  if($('n_branch'))$('n_branch').onchange=()=>{loadOrderStaff();updateCustomerOrderCount();};

    const activeOrderBranch=Number($('n_branch')?.value||selectedBranch||me.branch_id);
    if(!staffBranchReady||staffBranchReady!==activeOrderBranch){$('ferr').textContent='انتظر تحميل موظفي الفرع الصحيح قبل تسجيل الطلب';$('ferr').className='msg e';return;}
    if(!$('n_staff')?.value){$('ferr').textContent='اختار موظف الكول سنتر صاحب الطلب';$('ferr').className='msg e';return;}
    const orderNumber=String($('n_no')?.value||'').trim();
    if(!orderNumber){const e=$('ferr');e.textContent='اكتب رقم الطلب أولاً';e.className='msg e';$('n_no')?.focus();return;}
    const phone=String($('n_p')?.value||'').trim();
    const normalizedCustomerPhone=deliveryMobile(phone);
    if(phone&&!normalizedCustomerPhone){
      const e=$('ferr');e.textContent='رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 010 أو 011 أو 012 أو 015، أو بصيغة +20';e.className='msg e';$('n_p')?.focus();return;
    }
    orderSubmitting=true;
    const controls=[...d.querySelectorAll('button,input,select,textarea')].map(element=>[element,element.disabled]);
    controls.forEach(([element])=>{element.disabled=true;});
    $('n_ok').textContent='جارٍ حفظ الطلب...';
    const {data: createdId, error} = await safeRpc('dlv_create_order', {p_order_no: $('n_no').value, p_customer: isMgr ? $('n_c').value : null, p_phone: isMgr ? normalizedCustomerPhone||null : null,
      p_address: isMgr ? $('n_a').value : null, p_notes: isMgr ? $('n_n').value : null, p_driver: null, p_callcenter_staff_id:Number($('n_staff').value), p_branch_id: (isOwner() || (me.allowed_branch_ids||[]).length>1) ? Number($('n_branch').value) : null});
    if(!d.isConnected)return;
    if (error) { orderSubmitting=false;controls.forEach(([element,disabled])=>{element.disabled=disabled;});$('n_ok').textContent='تسجيل'; const e = $('ferr'); e.textContent = error.message; e.className = 'msg e'; return; }
    const orderNo=orderNumber;
    let trackingCode='';
    if(createdId){
      const {data:createdCode,error:trackError}=await safeRpc('dlv_get_order_tracking_code',{p_order_id:Number(createdId)});
      if(!d.isConnected)return;
      if(trackError)console.warn('Tracking code lookup:',trackError.message);
      trackingCode=String(createdCode||'').trim();
    }

function ysBadgeInk(red,green,blue){
 const values=[red,green,blue].map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4});

 return (l+.05)/.05>=1.05/(l+.05)?'#000000':'#ffffff';
}

   if(!rgb||(rgb[4]!==undefined&&Number(rgb[4])<1))return;

function reportOperationalDay(){

 const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));
 const date=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)));
 if(Number(parts.hour)<5)date.setUTCDate(date.getUTCDate()-1);
 return date.toISOString().slice(0,10);
}

  if(typeof L==='undefined'){ $('lmap').textContent='تعذر تحميل خدمة الخرائط. تحقق من الاتصال ثم افتح الخريطة مجددًا.'; $('mclose').onclick=()=>d.remove(); return; }
  map = L.map('lmap').setView([30.0444, 31.2357], 12);

  let activeTiles=satelliteTiles.addTo(map);
  const layerSelect=document.createElement('select');

  $('msel').parentElement.appendChild(layerSelect);
  layerSelect.onchange=()=>{if(!current())return;map.removeLayer(activeTiles);activeTiles=layerSelect.value==='streets'?streetTiles:satelliteTiles;activeTiles.addTo(map)};
  satelliteTiles.on('tileerror',()=>{if(!current()||activeTiles!==satelliteTiles)return;map.removeLayer(satelliteTiles);activeTiles=streetTiles;streetTiles.addTo(map);layerSelect.value='streets';const c=$('mcount');if(c)c.textContent='تعذر تحميل القمر الصناعي؛ تم عرض الشوارع'});
  markers = {}; const accuracyCircles = {}, prevPos = {}, lastHeading = {}, lastLive = {}; let fitted = false, mapBusy = false;
  async function refresh() {

    catch(e) { mapBusy = false; return; }

    if(!current())return;
    if (l.error) {const n=$('mcount');if(n&&l.error)n.textContent='⚠ تعذر تحديث المواقع';return;}
    const name = Object.fromEntries(drivers.map(x => [x.user_id, x.full_name]));
    const ord = {}; (o.data || []).forEach(x => { (ord[x.driver_id] = ord[x.driver_id] || []).push('#' + x.order_no + (x.status === 'out' ? ' 🛵' : '')); });
    const seen = new Set();

    const validLocations=(l.data||[]).filter(r=>authorizedDrivers.has(r.driver_id)&&Number(r.branch_id)===Number(scopeBranch)).map(r=>ysGps.snapshot(r,Date.now(),ysGps.nowMono(),ysGps.nowMono()-requestStarted)).filter(r=>ysGps.state(r).valid);
    validLocations.filter(r => !only || r.driver_id === only).forEach(r => {
      seen.add(r.driver_id);
      const move=ysGps.motion(prevPos[r.driver_id],r);if(!move.accept)return;

      const oldPos = prevPos[r.driver_id],gpsAccuracy=r.accuracy;
      if(move.rotate)lastHeading[r.driver_id]=bikeBearing(oldPos,r);
      const bearing=lastHeading[r.driver_id]??0;
      prevPos[r.driver_id]=r;lastLive[r.driver_id]=live;
      const ic = bikeIcon(bearing, live, 72);
      // The circle represents reported GPS uncertainty, not a guaranteed exact street position.
      if (Number.isFinite(gpsAccuracy) && gpsAccuracy>0 && gpsAccuracy<=150) {
        if (accuracyCircles[r.driver_id]) accuracyCircles[r.driver_id].setLatLng([r.lat,r.lng]).setRadius(gpsAccuracy).setStyle({opacity:live?0.55:0.2,fillOpacity:live?0.08:0.03});
        else accuracyCircles[r.driver_id]=L.circle([r.lat,r.lng],{radius:gpsAccuracy,color:'#1976d2',weight:1,opacity:live?0.55:0.2,fillOpacity:live?0.08:0.03,interactive:false}).addTo(map);
      } else if (accuracyCircles[r.driver_id]) {map.removeLayer(accuracyCircles[r.driver_id]);delete accuracyCircles[r.driver_id];}
      const m = markers[r.driver_id];
      if (m) { if(move.animate)animateRiderMarker(m,r.lat,r.lng,2500); else {cancelRiderAnimation(m);m.setLatLng([r.lat,r.lng]);} m.setIcon(ic); m.getPopup().setContent(html); m.setOpacity(live?1:0.55); }
      else { markers[r.driver_id] = L.marker([r.lat, r.lng], { icon: ic, opacity:live?1:0.55 }).addTo(map).bindPopup(html); }
    });
    Object.keys(markers).forEach(k => { if (!seen.has(k)) { cancelRiderAnimation(markers[k]);map.removeLayer(markers[k]); delete markers[k];delete lastLive[k]; if(accuracyCircles[k]){map.removeLayer(accuracyCircles[k]);delete accuracyCircles[k];} delete prevPos[k]; delete lastHeading[k]; } });
    $('mcount').textContent = only && !seen.size ? 'لا يوجد موقع متاح لهذا الطيار' : seen.size + ' طيار · '+[...seen].filter(id=>prevPos[id]&&ysGps.state(prevPos[id]).live).length+' موقع حديث';
    if (!fitted && seen.size) { if (only) { const m = markers[only]; map.setView(m.getLatLng(), 16); m.openPopup(); } else map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.3)); fitted = true; }
  }
  function expireMarkers(){
    if(!current()){closeMap();return;}
    for(const id of Object.keys(markers)){if(lastLive[id]&&!ysGps.state(prevPos[id]).live){lastLive[id]=false;cancelRiderAnimation(markers[id]);markers[id].setOpacity(0.55);markers[id].getPopup().setContent('⚠ آخر موقع معروف — لا يوجد تحديث GPS حديث.');accuracyCircles[id]?.setStyle({opacity:0.2,fillOpacity:0.03});}}

  }
  function closeMap(){if(closed)return;closed=true;clearInterval(mapTimer);clearInterval(expiryTimer);document.removeEventListener('visibilitychange',mapVisibilityRefresh);window.removeEventListener('online',mapVisibilityRefresh);Object.values(markers).forEach(cancelRiderAnimation);map.remove();d.remove();}
  const mapVisibilityRefresh=()=>{if(current()&&document.visibilityState==='visible'){expireMarkers();map.invalidateSize();refresh();}};
  document.addEventListener('visibilitychange',mapVisibilityRefresh);
  window.addEventListener('online',mapVisibilityRefresh);
  $('msel').onchange = () => { fitted = false; refresh(); };
  setTimeout(()=>{if(current())map.invalidateSize()},150);

  d.addEventListener('private-session-ended',closeMap);$('mclose').onclick=closeMap;
}

/* ---------- إضافة طيار (المدير) ---------- */
function addDriverForm(fixedBranchId=null,companyBranches=null) {

  if(!isOwner())return flash('إنشاء حسابات الموظفين متاح لمالك منصة Your Staff فقط',false);
  const pw = generateStrongPassword();

    '<div id="a_custom_wrap" class="hide"><label>اسم الوظيفة الجديدة *</label><input id="a_custom_title" maxlength="60" placeholder="مثال: كاشير، ويتر، كابتن صالة" autocomplete="off"><p class="meta">الوظيفة الجديدة لا تمنح صلاحيات تشغيل تلقائيًا. يمكن ربطها بقسم الكاشير أو الصالة لاحقًا.</p></div>' +
    '<label>الفرع *</label><select id="a_branch"></select>' +
    '<label>الإيميل (اختياري — لو سبته فاضي بيتعمل تلقائي من الكود)</label><input id="a_m" type="email" dir="ltr" placeholder="name@gmail.com"><label>كلمة السر (12 حرفًا على الأقل: كبير وصغير ورقم ورمز)</label><input id="a_p" type="password" autocomplete="new-password" value="' + pw + '"><label style="display:flex;gap:8px;align-items:center"><input id="a_show_pw" type="checkbox" style="width:auto"> إظهار كلمة السر مؤقتًا</label>' +
    '<div class="meta" style="margin-top:8px">الإيميل: <b id="a_e" dir="ltr">—</b></div>' +
    '<div class="row" style="margin-top:14px"><button class="p big" id="a_ok" style="flex:1">إنشاء الحساب</button><button class="big" id="a_x" style="flex:0 0 90px">إغلاق</button></div></div>';
  document.body.appendChild(d);
  // Resolve the owner company from the server, not from an employee's branch grants.
  // Never show branches belonging to another company.
  let validChoices=[];
  const branchSelect=d.querySelector('#a_branch');
  const createButton=d.querySelector('#a_ok');
  const branchError=d.querySelector('#aerr');
  branchSelect.disabled=true;
  branchSelect.innerHTML='<option value="">جاري تحميل فروع الشركة...</option>';
  createButton.disabled=true;
  async function loadAccountBranches(){
    const ownerCompany=isOwner()&&Number.isInteger(Number(ownerActiveCompanyId))&&Number(ownerActiveCompanyId)>0
      ?Number(ownerActiveCompanyId):null;
    let choices=Array.isArray(companyBranches)?companyBranches:null;
    if(ownerCompany){
      const result=await safeRpc('dlv_owner_company_branches',{p_company_id:ownerCompany});
      if(!d.isConnected)return;
      if(result.error){branchError.textContent='تعذر تحميل فروع الشركة: '+result.error.message;branchError.className='msg e';branchSelect.innerHTML='<option value="">تعذر تحميل الفروع</option>';return;}
      choices=(result.data||[]).filter(b=>b.active).map(b=>({id:Number(b.id),name:b.name}));
    }else if(!choices){
      // A manager's branch permissions are resolved by the server, not guessed
      // from a possibly incomplete/stale local profile.
      const result=await safeRpc('dlv_my_branches');
      if(!d.isConnected)return;
      if(result.error){
        branchError.textContent='تعذر التحقق من فروع حسابك: '+result.error.message;
        branchError.className='msg e';
        branchSelect.innerHTML='<option value="">تعذر تحميل الفروع</option>';
        return;
      }
      choices=(result.data||[]).map(b=>({id:Number(b.id),name:b.name}));
      if(fixedBranchId)choices=choices.filter(b=>Number(b.id)===Number(fixedBranchId));
    }
    if(!d.isConnected)return;
    validChoices=(choices||[]).filter(b=>Number.isInteger(Number(b.id))&&Number(b.id)>0);
    branchSelect.innerHTML='<option value="">-- اختر الفرع --</option>'+validChoices.map(b=>'<option value="'+Number(b.id)+'">'+esc(b.name)+'</option>').join('');
    if(fixedBranchId&&validChoices.some(b=>Number(b.id)===Number(fixedBranchId)))branchSelect.value=String(fixedBranchId);
    else if(selectedBranch&&validChoices.some(b=>Number(b.id)===Number(selectedBranch)))branchSelect.value=String(selectedBranch);
    else if(validChoices.length===1)branchSelect.value=String(validChoices[0].id);
    branchSelect.disabled=!!fixedBranchId||!validChoices.length;
    createButton.disabled=!validChoices.length;
    if(!validChoices.length){branchError.textContent='لا توجد فروع مفعلة ومصرح بها لهذا الحساب. يلزم منح صلاحية الفرع من إدارة الشركة، أو فتح إنشاء الحساب من لوحة مالك المنصة.';branchError.className='msg e';}
  }
  loadAccountBranches().catch(e=>{if(!d.isConnected)return;branchError.textContent='تعذر تحميل الفروع، أعد فتح النافذة';branchError.className='msg e';console.error('Branch selector failed',e)});
  const mail = () => { const m = $('a_m').value.trim().toLowerCase(); return m.includes('@') ? m : 'd' + $('a_c').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '') + '@waha.com'; };
  const show = () => { $('a_e').textContent = ($('a_c').value.trim() || $('a_m').value.trim()) ? mail() : '—'; }; $('a_c').oninput = show; $('a_m').oninput = show;
  const jobHelp=d.querySelector('#a_job_help');
  const jobHints={driver:'الطيار: يرى الطلبات المسندة إليه فقط.',supervisor:'المشرف: يستلم الجاهز من المطبخ ويوزعه على الطيارين.',manager:'مدير الفرع: يتابع التشغيل والتقارير داخل فروعه المصرح بها.',callcenter:'متابعة الكول سنتر: تسجيل الطلبات والتواصل المصرح مع العملاء.',kitchen:'كنترول المطبخ: استلام وتجهيز الطلبات وتحويلها للمشرف.',complaints_officer:'مسؤول الشكاوى: شاشة مستقلة للشكاوى، البحث والمتابعة وتسجيل الإجراءات، والتواصل المصرح مع العميل.'};
  const updateJobHelp=()=>{const custom=d.querySelector('#a_j').value==='custom';d.querySelector('#a_custom_wrap').classList.toggle('hide',!custom);jobHelp.textContent=custom?'سيتم إنشاء الحساب بوظيفة مخصصة دون صلاحيات تشغيل لحين ربطها بقسمها.':(jobHints[d.querySelector('#a_j').value]||'');};
  d.querySelector('#a_j').addEventListener('change',updateJobHelp);updateJobHelp();
  d.querySelector('#a_show_pw').onchange=()=>{d.querySelector('#a_p').type=d.querySelector('#a_show_pw').checked?'text':'password'};
  $('a_x').onclick = () => d.remove();
  $('a_ok').onclick = async () => {
    if (!requireOnline('إنشاء حساب الموظف')) return;
    const name = $('a_n').value.trim(), code = $('a_c').value.trim(), pass = $('a_p').value, email = mail();
    const er = $('aerr'), fail = t => { er.textContent = t; er.className = 'msg e'; $('a_ok').disabled = false; };
    if (!name || !code) return fail('اكتب الاسم والكود');
    if(!validChoices.some(b=>Number(b.id)===Number($('a_branch').value)))return fail('اختر فرعًا مصرحًا به من القائمة');
    // Owner selects any active branch in the current company; a fixed branch applies only to non-owner contexts.
    if(!isOwner() && fixedBranchId && Number($('a_branch').value)!==Number(fixedBranchId))return fail('الفرع غير مطابق');
    if (pass.length < 12 || !/[A-Z]/.test(pass) || !/[a-z]/.test(pass) || !/[0-9]/.test(pass) || !/[^A-Za-z0-9]/.test(pass)) return fail('كلمة السر يجب أن تكون 12 حرفًا على الأقل وبها حرف كبير وصغير ورقم ورمز');
    if (!$('a_m').value.includes('@') && !/[a-z0-9]/i.test(code)) return fail('اكتب كود بأرقام أو حروف إنجليزي، أو اكتب الإيميل بنفسك');
    $('a_ok').disabled = true;
    const selectedAccountBranch=Number($('a_branch').value);
    const customTitle=$('a_custom_title').value.trim();
    if($('a_j').value==='custom'&&(customTitle.length<2||customTitle.length>60||/[<>\x00-\x1f]/.test(customTitle)))return fail('اكتب اسم وظيفة من 2 إلى 60 حرفًا بدون رموز غير صالحة');
    const { data, error } = await safeRpc('dlv_create_account', { p_email: email, p_password: pass, p_name: name, p_code: code, p_job: $('a_j').value==='custom'?'custom:'+customTitle:$('a_j').value, p_branch_id: selectedAccountBranch });
    if (error) return fail(error.message);
    const jobSel = $('a_j'), jobVal = jobSel.value, jobName = jobVal==='custom'?customTitle:jobSel.options[jobSel.selectedIndex].text; if (jobVal === 'driver') drivers.push({ user_id: data, full_name: name, employee_code: code });
    const f = $('f_dr'); if (f && jobVal === 'driver') f.insertAdjacentHTML('beforeend', '<option value="' + data + '">' + esc(name) + '</option>');
    const branchName = $('a_branch').selectedOptions[0].text;
    const txt = name + '\nالوظيفة: ' + jobName + '\nالفرع: ' + branchName + '\nالإيميل: ' + email + '\nكلمة السر: ' + pass;
    d.firstChild.innerHTML = '<h2 style="font-size:16px">✅ تم إنشاء الحساب</h2><div class="card" style="white-space:pre-line;direction:rtl">' + esc(txt) + '</div>' +
      '<div class="meta">احتفظ ببيانات الدخول وسلّمها للطيار، كلمة السر مش هتظهر تاني.</div>' +
      '<div class="row" style="margin-top:14px"><button class="p big" id="a_cp" style="flex:1">نسخ</button><button class="big" id="a_x2" style="flex:0 0 90px">إغلاق</button></div>';
    $('a_cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(txt); $('a_cp').textContent = 'اتنسخ ✓'; };
    $('a_x2').onclick = () => d.remove();
  };

      // Transient network/API errors must never terminate the customer's tracking session.
      const warn = $('trackConnectionNotice');
      if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">الاتصال بالخريطة متقطع مؤقتًا؛ سنحاول التحديث تلقائيًا دون إغلاق المتابعة.</div>');
      return;
    }
    if (!j || !j.found) {
      if (j && j.limited) {
        const warn = $('trackConnectionNotice');
        if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">ضغط مؤقت على خدمة التتبع؛ سنعيد المحاولة تلقائيًا.</div>');
        return;
      }
      clearCustomerIdentity();
      box.innerHTML = '<div class="msg e">' + (j && j.expired ? 'انتهت صلاحية الكود' : 'الكود غير صحيح، راجع الكود مع خدمة العملاء') + '</div>';
      $('tmap').style.display = 'none'; clearInterval(tmr); return;
    }
    // Customer branding comes only from the validated tracking code's tenant.
    if(j.brand&&typeof j.brand==='object'){
      const bn=String(j.brand.name||'المطعم').slice(0,120);
      const logo=String(j.brand.logo_url||'');
      const logoSafe=/^https:\/\/[^"'<>\s]+$/i.test(logo)||(/^[a-z0-9_./-]+$/i.test(logo)&&!logo.startsWith('//'));
      const color=String(j.brand.brand_color||'');
      const gold=String(j.brand.gold_color||'');
      if(/^#[0-9a-f]{6}$/i.test(color))document.documentElement.style.setProperty('--brand',color);
      if(/^#[0-9a-f]{6}$/i.test(gold))document.documentElement.style.setProperty('--gold',gold);
      document.querySelectorAll('[data-brand-logo]').forEach(el=>{el.src=logoSafe?logo:'yourstaff-icon.svg';el.alt='شعار '+bn;});
      document.querySelectorAll('[data-brand-title]').forEach(el=>el.textContent=bn);
      brandConfig={...brandConfig,brand_name:bn,logo_url:logoSafe?logo:''};
      const trackingPalette={...PLATFORM_BRAND,brand_color:/^#[0-9a-f]{6}$/i.test(color)?color:PLATFORM_BRAND.brand_color,gold_color:/^#[0-9a-f]{6}$/i.test(gold)?gold:PLATFORM_BRAND.gold_color};
      for(const [key,value] of Object.entries(ysThemeColors(trackingPalette)))document.documentElement.style.setProperty(key,value);
      document.title='متابعة الطلب — '+bn;
    }
    const oldNotice = $('trackConnectionNotice'); if (oldNotice) oldNotice.remove();
    const S = ['تم تسجيل طلبك', 'جاري التجهيز في المطبخ', 'جاهز ومع المشرف', 'اتعيّن لك طيار', 'الطيار خرج لك', 'تم التسليم'];
    const idx = j.status === 'delivered' ? 5 : j.status === 'out' ? 4 : j.pilot_name ? 3 : (j.stage === 'kitchen_ready' || j.stage === 'supervisor_received') ? 2 : 1;
    let h = '<div class="card"><b style="font-size:20px">طلب رقم #' + esc(j.order_no) + '</b>';
    if (j.status === 'failed') h += '<div class="msg e" style="margin-top:10px">تعذر توصيل الطلب، هيتواصل معاك فريق الخدمة.</div>';
    else if (j.status === 'cancelled') h += '<div class="msg e" style="margin-top:10px">تم إلغاء الطلب.</div>';
    else h += S.map((t, i) => '<div class="od" style="margin-top:8px;opacity:' + (i <= idx ? 1 : .45) + '"><span>' + (i < idx ? '✓ ' : i === idx ? '● ' : '○ ') + t + '</span>' + (i === 4 && j.out_at ? '<span class="meta">' + tm(j.out_at) + '</span>' : i === 5 && j.delivered_at ? '<span class="meta">' + tm(j.delivered_at) + '</span>' : '') + '</div>').join('');
    if(j.pilot_reassigned) h += '<div class="msg o" style="margin-top:10px">🔁 تم تغيير الطيار المسؤول عن طلبك. بيانات الطيار المعروضة هي البيانات الحالية.</div>';
    h += '</div>';
    if (j.pilot_name && j.status !== 'failed' && j.status !== 'cancelled') {
      const rawPilotPhone = String(j.pilot_phone || '').trim();
      let pilotDigits = rawPilotPhone.replace(/\D/g, '');
      if (pilotDigits.startsWith('0')) pilotDigits = '20' + pilotDigits.slice(1);
      const hasPilotPhone = /^20(?:10|11|12|15)\d{8}$/.test(pilotDigits);
      const callAction = hasPilotPhone
        ? '<a href="tel:+' + pilotDigits + '" class="pilot-contact-btn pilot-call" dir="rtl"><span aria-hidden="true">☎</span> اتصال</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">☎ اتصال</button>';
      const waAction = hasPilotPhone
        ? '<a href="https://wa.me/' + pilotDigits + '" target="_blank" rel="noopener noreferrer" class="pilot-contact-btn pilot-wa" dir="rtl"><span aria-hidden="true">◉</span> واتساب</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">◉ واتساب</button>';
      h += '<div class="card pilot-contact-card"><div class="meta">الطيار</div><b style="font-size:20px">' + esc(j.pilot_name) + '</b><div class="pilot-contact-actions">' + callAction + waAction + '</div>' + (!hasPilotPhone ? '<div class="meta">رقم الطيار غير متاح للتواصل. يُرجى التأكد من تسجيل رقم صحيح في إدارة الحسابات، ولا تُعرض بيانات الاتصال إلا للعميل المصرّح له.</div>' : '<div class="meta" dir="ltr" style="text-align:right">' + esc(rawPilotPhone) + '</div>') + '</div>';
    }
    trackStatus=j.status;
    const nextFix=ysGps.snapshot({lat:j.lat,lng:j.lng,accuracy:j.accuracy,loc_at:j.loc_at,server_at:j.server_at},Date.now(),ysGps.nowMono(),ysGps.nowMono()-requestStarted);
    const move=ysGps.motion(latestTrackFix,nextFix);if(move.accept||!ysGps.state(nextFix).valid)latestTrackFix=nextFix;
    h+='<div id="trackGpsStatus" class="card" style="font-size:13px" role="status"></div>';
    box.innerHTML=h;const m=$('tmap');
    if(j.status==='out'&&ysGps.state(latestTrackFix).live&&typeof L!=='undefined'&&navigator.onLine){
      m.style.display='block';const fix=latestTrackFix;
      if(!mapT){mapT=L.map('tmap').setView([fix.lat,fix.lng],15);deliveryTrackingTiles(mapT);mk=L.marker([fix.lat,fix.lng],{icon:bikeIcon(lastTrackHeading,true,90),keyboard:false}).addTo(mapT);}
      else if(move.accept){if(move.rotate&&lastTrackPos)lastTrackHeading=bikeBearing(lastTrackPos,fix);if(move.animate)animateRiderMarker(mk,fix.lat,fix.lng,2500);else{cancelRiderAnimation(mk);mk.setLatLng([fix.lat,fix.lng]);}mk.setIcon(bikeIcon(lastTrackHeading,true,90));if(move.animate)mapT.panTo([fix.lat,fix.lng],{animate:true,duration:1});}
      lastTrackPos=fix;
    }else removeCustomerMap();
    updateGpsStatus();
    if (j.status === 'delivered') {
      m.style.display = 'none';
      removeCustomerMap();
      const already = j.rated === true;
      if (already) {
        box.innerHTML += '<div class="card"><h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييمك بنجاح.</div></div>';
      } else {
        box.innerHTML += `<div class="card" id="ratingCard"><h2>⭐ قيّم تجربتك مع ${esc(brandConfig.brand_name||"المطعم")}</h2><div class="meta">يسعدنا نعرف رأيك بعد استلام طلبك.</div>
          <label>تقييم الطيار</label><div class="rateRow" data-rate="delivery">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم المطعم</label><div class="rateRow" data-rate="restaurant">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم موظف متابعة الكول سنتر</label><div class="rateRow" data-rate="callcenter">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تعليقك (اختياري)</label><textarea id="rateComment" maxlength="1000" placeholder="اكتب ملاحظاتك هنا"></textarea>
          <button class="p big" id="sendRating">إرسال التقييم</button><div id="rateMsg" class="meta"></div></div>`;
        const scores={delivery:0,restaurant:0,callcenter:0};
        document.querySelectorAll('.rateRow').forEach(row=>row.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const key=row.dataset.rate;scores[key]=Number(btn.dataset.v);row.querySelectorAll('button').forEach(b=>b.textContent=Number(b.dataset.v)<=scores[key]?'★':'☆');}));
        $('sendRating').onclick=async()=>{if(!scores.delivery||!scores.restaurant||!scores.callcenter){$('rateMsg').textContent='من فضلك قيّم الأقسام الثلاثة';return;}
          $('sendRating').disabled=true;$('rateMsg').textContent='جارٍ إرسال تقييمك...';
          try {
            const {data,error}=await safeRpc('dlv_submit_customer_rating',{p_code:code,p_delivery:scores.delivery,p_restaurant:scores.restaurant,p_callcenter:scores.callcenter,p_comment:$('rateComment').value||null});
            if(error){$('sendRating').disabled=false;$('rateMsg').textContent=error.message;return;}
            if(data?.rate_limited){$('sendRating').disabled=false;$('rateMsg').textContent=data.message||'محاولات كثيرة. حاول مرة أخرى بعد دقيقة';return;}
            if(data?.already_rated){$('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييم هذا الطلب من قبل.</div>';return;}
            if(data?.success!==true){$('sendRating').disabled=false;$('rateMsg').textContent=data?.message||'لم نتمكن من حفظ التقييم. حاول مرة أخرى.';return;}
            $('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">وصل تقييمك لفريق الشركة المختص.</div>';
          } catch(e) {
            $('sendRating').disabled=false;
            $('rateMsg').textContent='تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.';
          }
        };
      }
      clearInterval(tmr);
    }
  }
  $('tg').onclick = () => { clearInterval(tmr); go(); tmr = setInterval(go, 5000); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('tc')) go(); });
  window.addEventListener('online',()=>{if($('tc')===ownCodeField)go();});
  window.addEventListener('offline',updateGpsStatus);
  if (code0) $('tg').onclick();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const _t = new URLSearchParams(location.search).get('t'); (async()=>{if (_t !== null) {document.documentElement.classList.remove('ys-public');trackView(_t);} else boot();})();
</script>
</body>
</html>
