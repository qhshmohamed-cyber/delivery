name: Android release security build (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'native/**'
      - 'native-background.js'
      - 'tests/native*'
      - 'scripts/install-android-background.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/build-android-web.mjs'
      - 'scripts/harden-android.mjs'
      - 'scripts/verify-android-release.py'
      - 'tests/android_hardening.test.cjs'
      - '.github/workflows/android-cloud-build.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned SDK with native auth storage
        run: node tests/native_sdk_integration.cjs
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        run: npm run android:init
      - name: Build unsigned release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify packaged security controls
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/yourstaff-release-manifest.xml
          python3 scripts/verify-android-release.py /tmp/yourstaff-release-manifest.xml
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android background service on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yourstaff.delivery.BackgroundServiceTest
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yourstaff-native-test-results
          path: android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned release APK (NOT install-ready)
        uses: actions/upload-artifact@v4
        with:
          name: your-staff-unsigned-release-apk-not-for-install
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned AAB (NOT Play-ready)
        uses: actions/upload-artifact@v4
        with:
          name: your-staff-unsigned-aab-not-for-play
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
