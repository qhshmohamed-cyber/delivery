const cairoDate = d => (d || new Date()).toLocaleDateString('en-CA', {timeZone:'Africa/Cairo'});

 brandConfig={...PLATFORM_BRAND};activeBrandCompanyId=null;

 const safeAsset=v=>{const url=String(v||'');return (/^https:\/\/[^\\\"'<>\s]+$/i.test(url)||/^[a-z0-9_./-]+$/i.test(url))&&!url.startsWith('//')?'url('+JSON.stringify(url)+')':'none'};

}

 profileSyncBusy=true;
 try{
  const {data,error}=await sb.from('dlv_profiles').select('*').eq('user_id',me.user_id).maybeSingle();
  if(error){console.warn('Profile refresh failed:',error.message);return;}
  const sig=profileSignature(data);
  if(sig!==profileSyncFingerprint){profileSyncFingerprint=sig;selectedBranch=null;await boot();}
 }catch(e){console.warn('Profile refresh unavailable:',e)}
 finally{profileSyncBusy=false;}
}
function startProfileSync(){
 if(!me)return;
 profileSyncFingerprint=profileSignature(me);
 if(profileSyncChannel){sb.removeChannel(profileSyncChannel);profileSyncChannel=null;}
 profileSyncChannel=sb.channel('my-profile-'+me.user_id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'dlv_profiles',filter:'user_id=eq.'+me.user_id},()=>{void checkProfileUpdates();}).subscribe();
 if(profileSyncTimer)clearInterval(profileSyncTimer);
 profileSyncTimer=setInterval(()=>{void checkProfileUpdates()},30000);
}
function stopProfileSync(){
 if(profileSyncTimer){clearInterval(profileSyncTimer);profileSyncTimer=null;}
 if(profileSyncChannel){sb.removeChannel(profileSyncChannel);profileSyncChannel=null;}
 profileSyncFingerprint='';
}

let realtimeState = 'CLOSED';
let realtimeRetryTimer = null;
let reconnectRefreshTimer = null;
let operationalRefreshBusy = false;
let operationalRefreshPending = false;
let lastOperationalRefreshAt = 0;
async function performOperationalRefresh() {
  if (!me || document.visibilityState !== 'visible' || !navigator.onLine) return;
  if (operationalRefreshBusy) { operationalRefreshPending = true; return; }
  operationalRefreshBusy = true;
  try {
    await Promise.resolve(refreshView());
    if (canViewManagerBoard()) {
      await Promise.allSettled([loadManagerLiveKpis(),loadManagerOpsPending(),loadManagerDelayed(),refreshKitchenDelayNotices()]);
    }
    lastOperationalRefreshAt = Date.now();
  } catch(e) { console.warn('Realtime refresh failed',e); }
  finally {
    operationalRefreshBusy = false;
    if (operationalRefreshPending) {
      operationalRefreshPending = false;
      refreshOperationalData();
    }
  }
}
function refreshOperationalData() {
  if (!me || document.visibilityState !== 'visible' || !navigator.onLine) return;
  clearTimeout(reconnectRefreshTimer);
  reconnectRefreshTimer = setTimeout(performOperationalRefresh, 250);
}
// Lightweight fallback when a mobile browser suspends websocket events.
setInterval(() => {
  if (me && document.visibilityState === 'visible' && navigator.onLine &&
      Date.now() - lastOperationalRefreshAt > 30000) refreshOperationalData();
}, 30000);
function startOrderRealtime() {
  if (!me) return;
  if (chan) { try { sb.removeChannel(chan); } catch (e) {} chan = null; }
  chan = sb.channel('dlv-orders-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'dlv_orders'}, refreshOperationalData)
    .subscribe(status => {
      realtimeState = status;
      if (status === 'SUBSCRIBED') {
        clearTimeout(realtimeRetryTimer);
        refreshOperationalData();
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        clearTimeout(realtimeRetryTimer);
        realtimeRetryTimer = setTimeout(() => {
          if (me && navigator.onLine && document.visibilityState === 'visible') startOrderRealtime();
        }, 5000);
      }
    });
}
window.addEventListener('online', () => {
  if (!me) return;
  refreshOperationalData();
  if (!chan || realtimeState !== 'SUBSCRIBED') startOrderRealtime();
  refreshMe();
});
window.addEventListener('offline', () => {

});

async function refreshKitchenDelayNotices() {
  if (!me || !(canViewManagerBoard() || me.workflow_role === 'callcenter_followup')) return;
  const {data,error} = await safeRpc('dlv_list_notifications');
  const box = $('delayNotices'); if (!box) return;
  if (error) { box.innerHTML = '<div class="msg e">تعذر تحميل التنبيهات: '+esc(error.message)+'</div>'; return; }
  // التنبيه المقروء يختفي من الشاشة نهائيًا، مع بقائه محفوظًا في السجل.
  const rows = (data || []).filter(n => !n.read_at && (n.notification_type === 'kitchen_delay' || !n.notification_type));
  box.innerHTML = rows.length ? '<section class="card" style="border:1px solid #e8590c;background:#fff4e6"><div class="ord"><b>🔔 تنبيهات تحتاج متابعة</b><span class="badge" style="background:#e8590c">'+rows.length+' جديد</span></div>' + rows.map(n => '<div class="msg e" style="margin-top:8px"><b>'+esc(n.title)+'</b><br>'+esc(n.body)+'<div class="meta">'+tm(n.created_at)+'</div><button data-delay-read="'+n.id+'" style="margin-top:6px">✓ تمت المعالجة وإخفاء التنبيه</button></div>').join('')+'</section>' : '';
  box.querySelectorAll('[data-delay-read]').forEach(b => b.onclick = async () => { if (!requireOnline('تحديث التنبيه')) return; b.disabled=true; await safeRpc('dlv_mark_notification_read',{p_id:Number(b.dataset.delayRead)}); refreshKitchenDelayNotices(); });
}
async function runKitchenDelayCheck() {
  if (!me || !(canViewManagerBoard() || me.workflow_role === 'callcenter_followup')) return;
  const {error} = await safeRpc('dlv_check_kitchen_delays');
  if (error) console.warn('Kitchen delay check:', error.message);
  await refreshKitchenDelayNotices();
}
function startKitchenDelayMonitor() {
  clearInterval(delayTimer);
  if (!me || !(canViewManagerBoard() || me.workflow_role === 'callcenter_followup')) return;
  runKitchenDelayCheck();
  delayTimer = setInterval(runKitchenDelayCheck, 60000);
}

async function safeRpc(name, args) {
  try {
    const result = await sb.rpc(name, args);
    return result || { data: null, error: { message: 'لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة.' } };
  } catch (err) {
    const message = err && err.message ? err.message : 'تعذر الاتصال بالخادم. لم يتم تأكيد حفظ العملية.';
    return { data: null, error: { message } };
  }
}
function requireOnline(action='تنفيذ العملية') {
  if (navigator.onLine) return true;
  flash(`لا يمكن ${action} بدون اتصال بالإنترنت. لم يتم حفظ أي تغيير؛ أعد المحاولة بعد عودة الاتصال.`, false);
  return false;
}

}

   if(gpsResult.error)throw gpsResult.error;

let watchId = null, lastSend = 0, wake = null, shareWanted = false, locationBusy = false, gpsPollTimer = null, gpsPollBusy = false;
function renderShare() {
  const b = $('shr'); if (!b) return;
  const on = shareWanted;
  b.textContent = on ? '⏹ إيقاف مشاركة الموقع' : '📍 ابدأ مشاركة الموقع';
  b.style.background = on ? '#e03131' : '';
  b.style.borderColor = on ? '#e03131' : '';

async function sendDriverPosition(p, force = false) {
  if (!shareWanted || locationBusy || !navigator.onLine) return;
  if (p?.timestamp && Date.now()-p.timestamp>30000) {const el=$('locst');if(el)el.textContent='⚠ قراءة GPS قديمة — ننتظر موقعًا أحدث';return;}
  // عند استئناف الصفحة نرسل القراءة الحالية فورًا حتى لو كان آخر إرسال حديثًا.
  if (!force && Date.now() - lastSend < 5000) return;
  if (!Number.isFinite(p?.coords?.latitude) || !Number.isFinite(p?.coords?.longitude) || !Number.isFinite(p?.coords?.accuracy) || p.coords.accuracy > 150 || Date.now()-p.timestamp>20000) {const st=$('locst');if(st)st.textContent='⚠ دقة GPS ضعيفة؛ انتظر إشارة أفضل';return;}
  locationBusy = true;
  try {
    const { error } = await safeRpc('dlv_update_location', {
      p_lat: p.coords.latitude, p_lng: p.coords.longitude, p_acc: p.coords.accuracy
    });
    const s = $('locst');
    if (s) s.textContent = error
      ? '⚠ تعذر إرسال الموقع: ' + error.message
      : '🟢 مشاركة الموقع نشطة — آخر إرسال ' + tm(new Date());
    if (!error) {lastSend = Date.now();const details=$('locdetail');if(details)details.textContent='دقة الموقع: '+Math.round(p.coords.accuracy)+' متر · آخر إرسال: '+new Date().toLocaleTimeString('ar-EG')+' · يجب إبقاء التطبيق مفتوحًا';}
  } catch(e) {const st=$('locst');if(st)st.textContent='⚠ فشل إرسال GPS: '+String(e?.message||'خطأ اتصال');} finally { locationBusy = false; }
}
function attachLocationWatch() {
  if (!shareWanted || watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(sendDriverPosition, e => {
    // أخطاء الشبكة/انتهاء المهلة مؤقتة؛ لا توقف مشاركة الطيار تلقائيًا.
    const s = $('locst');
    if (s) s.textContent = e.code === 1
      ? '⚠ صلاحية الموقع مرفوضة — راجع إعدادات المتصفح'
      : '⚠ الموقع غير متاح مؤقتًا — سنعيد المحاولة عند عودة الصفحة';
    if (e.code === 1) { stopShare(true); }
    else {
      if (watchId != null) {try{navigator.geolocation.clearWatch(watchId);}catch(e){}}watchId = null;
      // إعادة المحاولة المؤقتة فقط إذا كانت الصفحة ظاهرة؛ لا ننشئ حلقات إرسال بالخلفية.
      if (document.visibilityState === 'visible' && shareWanted) {
        setTimeout(() => {
          if (shareWanted && watchId == null && document.visibilityState === 'visible') attachLocationWatch();
        }, 5000);
      }
    }
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 25000 });
}
async function acquireWakeLock() {
  if (!shareWanted || document.visibilityState !== 'visible' || !navigator.wakeLock || wake) return;
  try {
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', () => { wake = null; });
  } catch (e) { /* Wake Lock تحسين اختياري وليس ضمانًا للتتبع بالخلفية */ }
}
async function startShare() {

/* ---------- أيقونة موتوسيكل واحة اليمن واتجاه الحركة ---------- */
function bikeBearing(a, b) {
  if (!a || !b || (a.lat === b.lat && a.lng === b.lng)) return 0;
  const rad = Math.PI / 180, y = Math.sin((b.lng-a.lng)*rad)*Math.cos(b.lat*rad);
  const x = Math.cos(a.lat*rad)*Math.sin(b.lat*rad)-Math.sin(a.lat*rad)*Math.cos(b.lat*rad)*Math.cos((b.lng-a.lng)*rad);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;

// Animate only between real GPS samples; never invent additional location readings.
const riderAnimations = new WeakMap();
function animateRiderMarker(marker, lat, lng, duration=2500) {
  if (!marker || !Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return;
  const target = L.latLng(Number(lat), Number(lng));
  const prior = riderAnimations.get(marker);
  if (prior) cancelAnimationFrame(prior);
  const start = marker.getLatLng();
  if (start.distanceTo(target) < 2 || start.distanceTo(target) > 2000 || document.visibilityState !== 'visible') {
    marker.setLatLng(target); riderAnimations.delete(marker); return;
  }
  const startAt = performance.now();
  // Interpolate real samples linearly; no stop-and-go easing at every GPS tick.
  const ease = t => t;
  function step(now) {
    if (!marker._map || document.visibilityState !== 'visible') {
      marker.setLatLng(target); riderAnimations.delete(marker); return;
    }
    const p = Math.min(1,(now-startAt)/duration), k=ease(p);
    marker.setLatLng([start.lat+(target.lat-start.lat)*k,start.lng+(target.lng-start.lng)*k]);
    if (p<1) riderAnimations.set(marker,requestAnimationFrame(step));
    else riderAnimations.delete(marker);
  }
  riderAnimations.set(marker,requestAnimationFrame(step));
}
function bikeIcon(bearing=0, live=true, size=90) {
  // Top-down artwork points north by default. GPS bearing is clockwise from north.
  const height=Math.max(92,Math.round(size*1.55));
  const width=Math.round(height*120/190);
  const angle=Number.isFinite(bearing)?bearing:0;
  const opacity=live?'1':'.6';
  const html='<div class="ys-motorcycle-icon" style="width:'+width+'px;height:'+height+'px;opacity:'+opacity+';transform:rotate('+angle+'deg);transform-origin:50% 50%;transition:transform .65s ease-out">'+
    '<img src="rider-topdown-v1.svg?v=20261113" alt="طيار واحة اليمن" draggable="false" style="display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))">'+
    '</div>';
  return L.divIcon({className:'ys-bike-marker ys-motorcycle-marker',html,iconSize:[width,height],iconAnchor:[Math.round(width/2),Math.round(height/2)],popupAnchor:[0,-Math.round(height/2)]});
}

    if (!fitted && seen.size) { if (only) { const m = markers[only]; map.setView(m.getLatLng(), 16); m.openPopup(); } else map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.3)); fitted = true; }

    $('p_cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(txt); $('p_cp').textContent = 'اتنسخ ✓'; };

  };
}

      let query=sb.from('dlv_orders').select('*, driver:driver_id(full_name)').eq('order_date',day).order('created_at').range(from,from+999);
      if(branch!=='all') query=query.eq('branch_id',Number(branch));
      else if(!isOwner()) query=query.in('branch_id',allowed);
      const {data,error}=await query;
      if(requestId!==reportRequest || !document.getElementById('rpt')) return;
      if(error){$('rbody').textContent='تعذر تحميل التقرير: '+error.message;return;}
      rows=rows.concat(data||[]);
      if(!data || data.length<1000) break;
      from+=1000;
    }
    const branchName=branch==='all'?'جميع الفروع':branchTitle(Number(branch));
    const c = st => rows.filter(o => o.status === st).length;
    const durOf = o => mins(o.out_at, o.delivered_at);
    const avgOf = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;

    const kp = [['إجمالي الطلبات', rows.length], ['تم التوصيل', c('delivered')], ['خرجت للتوصيل', c('out')], ['لم تخرج بعد', c('new') + c('received')], ['تعذر', c('failed')], ['ملغي', c('cancelled')], ['متأخرة', late], ['متوسط التوصيل (د)', avg == null ? '—' : avg]];
    $('rbody').innerHTML = '<h2 style="font-size:16px">واحة اليمن — '+esc(branchName)+' — تقرير يوم ' + esc(day) + '</h2>' +
      '<div class="grid">' + kp.map(k => '<div class="stat"><b>' + k[1] + '</b><span>' + k[0] + '</span></div>').join('') + '</div>' +

      (names.map(n => '<tr><td>' + esc(n) + '</td><td>' + by[n].t + '</td><td>' + by[n].d + '</td><td>' + by[n].o + '</td><td>' + by[n].f + '</td><td>' + by[n].l + '</td><td>' + (avgOf(by[n].du) == null ? '—' : avgOf(by[n].du)) + '</td></tr>').join('') || '<tr><td colspan="7">لا طلبات</td></tr>') + '</table></div>' +
      '<h2>كل الطلبات (' + rows.length + ')</h2><div class="card tw"><table><tr><th>الطلب</th><th>الطيار</th><th>العميل</th><th>جاهز (مطبخ)</th><th>استلام المشرف</th><th>تحويل للطيار</th><th>استلام الطيار</th><th>خروج</th><th>تسليم</th><th>المدة</th><th>الحالة</th></tr>' +
      (rows.map(o => '<tr><td><b>#' + esc(o.order_no) + '</b></td><td>' + esc(nm(o)) + '</td><td>' + esc(o.customer_name || '') + '</td><td>' + tm(o.kitchen_ready_at) + '</td><td>' + tm(o.supervisor_received_at) + '</td><td>' + tm(o.pilot_assigned_at) + '</td><td>' + tm(o.received_at) + '</td><td>' + tm(o.out_at) + '</td><td>' + tm(o.delivered_at) + '</td><td>' + (durOf(o) != null ? durOf(o) + ' د' : '—') + '</td>' +
        '<td style="white-space:normal;min-width:150px"><span class="badge" style="background:' + ST[o.status][1] + '">' + ST[o.status][0] + '</span>' + (isLate(o) ? ' <span class="late">⚠</span>' : '') +
        (o.failed_reason ? '<div class="meta">⛔ ' + esc(o.failed_reason) + '</div>' : '') + (o.driver_note ? '<div class="meta">📝 ' + esc(o.driver_note) + '</div>' : '') + '</td></tr>').join('') || '<tr><td colspan="11">لا طلبات في اليوم ده</td></tr>') + '</table></div>';
  }
  $('rdt').onchange=load; $('rbranch').onchange=load; load();
}

/* ---------- تحديث بيانات حسابي (الاسم/الوظيفة) ---------- */
async function refreshMe() {
  if (!me || !navigator.onLine) return;
  let result;
  try {
    result = await sb.from('dlv_profiles').select('*').eq('user_id', me.user_id).maybeSingle();
  } catch (e) {
    console.warn('تعذر تحديث بيانات الحساب مؤقتًا:', e?.message || e);
    return;
  }
  if (result?.error) {
    console.warn('تعذر تحديث بيانات الحساب مؤقتًا:', result.error.message);
    return;
  }
  const data = result?.data;
  // عدم وصول بيانات بسبب خطأ مؤقت لا يعني أن الحساب أُلغي أو عُطّل.
  if (!data) return;
  if (!data.active) {
    await sb.auth.signOut();
    me = null;
    selectedBranch = null;
    return loginView('الحساب اتعطّل');
  }
  const roleChanged = data.role !== me.role || data.workflow_role !== me.workflow_role;
  me = data;
  if (roleChanged) return boot();
  const n = $('hname'), m = $('hmeta');
  if (n) n.textContent = me.full_name;
  if (m) m.textContent = roleLabel(me) + ' · كود ' + me.employee_code;
}
setInterval(refreshMe, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    refreshMe();
    if (me) {
      refreshOperationalData();
      if (!chan || realtimeState !== 'SUBSCRIBED') startOrderRealtime();
    }
  }
});

/* ---------- مسار الطلب: مطبخ ← مشرف ← طيار ---------- */
function refreshView() { if (!me) return; if (me.role === 'driver') loadMine(); else if (me.workflow_role === 'kitchen') loadKitchen(); else if (me.workflow_role === 'callcenter_followup') { loadCallcenterOrders(); loadCallcenterRatings(); } else if(me.role==='complaints_officer'){loadComplaintsInbox();} else { loadAll(); loadPending(); loadCodes(); } }
const ordCard = (o, btn) => '<div class="card"><div class="ord"><b style="font-size:18px">#' + esc(o.order_no) + '</b><span class="badge" style="background:' + (o.workflow_stage === 'new' ? '#868e96' : '#2f9e44') + '">' + (STG[o.workflow_stage] || '') + '</span></div><div class="meta">' + esc([o.customer_name, o.phone, o.address].filter(Boolean).join(' · ')) + '</div>' + btn + '</div>';
function kitchenView() {
  $('app').innerHTML = shell('<div class="card"><h2>🍳 تجهيز الطلبات</h2><p class="meta">الطلبات الجديدة أولًا. بعد انتهاء التجهيز اضغط «جاهز — حوّل للمشرف».</p></div><div id="kq"></div>');
  bindOut(); loadKitchen();
}
async function loadKitchen() {
  const { data, error } = await branchQuery(sb.from('dlv_orders').select('*')).eq('status', 'new').is('driver_id', null).in('workflow_stage', ['new', 'kitchen_ready']).order('created_at').limit(200);
  if (error) return flash(error.message, false);
  const rows = data || [], a = rows.filter(o => o.workflow_stage === 'new'), b = rows.filter(o => o.workflow_stage === 'kitchen_ready');
  $('kq').innerHTML = '<h2>🍳 عند المطبخ (' + a.length + ')</h2>' + (a.map(o => ordCard(o, '<div class="acts"><button class="p" data-act="kfwd" data-id="' + o.id + '">✅ جاهز — حوّل للمشرف</button></div>')).join('') || '<div class="meta">لا يوجد</div>') +
    '<h2>بانتظار المشرف (' + b.length + ')</h2>' + (b.map(o => ordCard(o, '')).join('') || '<div class="meta">لا يوجد</div>');
}
async function loadPending() {
  const box = $('pend'); if (!box) return;
  let pendingQuery=branchQuery(sb.from('dlv_orders').select('*')).eq('status','new').order('created_at').limit(200);
  if(!isOwner())pendingQuery=pendingQuery.is('driver_id',null);
  const { data, error } = await pendingQuery;
  if (error) return;
  const wf = me.workflow_role || 'manager';
  const rows = (data || []).filter(o => wf !== 'supervisor' || o.workflow_stage === 'kitchen_ready' || o.workflow_stage === 'supervisor_received');
  const recv = o => wf === 'supervisor' && o.workflow_stage === 'kitchen_ready';
  const opts = '<option value="">اختر الطيار...</option>' + drivers.map(x => '<option value="' + x.user_id + '">' + esc(x.full_name) + '</option>').join('');
  box.innerHTML = rows.length ? '<h2>📥 طلبات منتظرة التحويل لطيار (' + rows.length + ')</h2>' + rows.map(o => {
    if (o.driver_id && isOwner()) return ordCard(o, '<div class="row" style="margin-top:8px"><b>🔁 تغيير الطيار المعين</b><select id="as_' + o.id + '" style="flex:1">' + opts + '</select><button class="p" data-act="assign" data-id="' + o.id + '">اعتماد تغيير الطيار</button></div>');
    if (recv(o)) return ordCard(o, '<div class="acts"><button class="p" data-act="srecv" data-id="' + o.id + '">✅ استلمت من المطبخ</button></div>');
    if (o.workflow_stage !== 'supervisor_received') return ordCard(o, '<div class="meta" style="margin-top:8px">بانتظار استلام المشرف من المطبخ</div>');
    return ordCard(o, '<div class="row" style="margin-top:8px"><select id="as_' + o.id + '" style="flex:1">' + opts + '</select><button class="p" data-act="assign" data-id="' + o.id + '">تحويل للطيار</button></div>');
  }).join('') : '';
}
async function assignOrder(id) {
  if (!requireOnline('تحويل الطلب للطيار')) return;
  const sel = $('as_' + id), pid = sel && sel.value; if (!pid) return flash('اختار الطيار الأول', false);
  if(isOwner() && !confirm('تأكيد تعيين أو تغيير الطيار لهذا الطلب؟'))return;
  const { error } = await safeRpc('dlv_assign_driver', { p_order_id: id, p_driver: pid, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتحوّل للطيار ✅', true); refreshView();
}
async function supervisorReceive(id) {
  if (!requireOnline('استلام الطلب من المطبخ')) return;
  const { error } = await safeRpc('dlv_supervisor_receive', { p_order_id: id, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتسجّل استلامك من المطبخ ✅', true); refreshView();
}
async function kitchenForward(id) {
  if (!requireOnline('تحويل الطلب للمشرف')) return;
  const { error } = await safeRpc('dlv_kitchen_forward', { p_order_id: id, p_note: null });
  if (error) return flash(error.message, false);
  flash('اتحوّل للمشرف ✅', true); refreshView();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && me && me.role === 'driver') {
    if (!shareWanted && watchId == null && !window._sd) startShare();
    else if (shareWanted) resumeDriverLocationNow();
  }
});

/* ---------- أكواد متابعة العملاء (للموظفين) ---------- */
const trackMsg = o => 'أهلًا ' + (o.customer_name || '') + '، تابع طلبك رقم #' + o.order_no + ' من هنا:\n' + location.origin + location.pathname + '?t=' + o.track_code + '\nكود المتابعة: ' + o.track_code;
function copyMsg(id) { const o = ORD[id]; if (!o) return; navigator.clipboard && navigator.clipboard.writeText(trackMsg(o)); flash('اتنسخت رسالة العميل، ابعتها له', true); }
function waMsg(id) {
  const o = ORD[id]; if (!o) return; let d = (o.phone || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '20' + d.slice(1);
  window.open('https://wa.me/' + d + '?text=' + encodeURIComponent(trackMsg(o)), '_blank');

async function loadCodes() {
  const box = $('codes'); if (!box) return;

}

/* ---------- صفحة العميل: تتبع الطلب بالكود (من غير دخول) ---------- */
function trackView(code0) {
  document.title = 'تتبع طلبك — '+(brandConfig.brand_name||'واحة اليمن');
  $('app').innerHTML = '<header><img data-brand-logo src="logo-original.png" alt="شعار البراند" style="width:52px;height:52px;min-width:52px;flex:0 0 52px;border-radius:10px;object-fit:contain;object-position:center;background:transparent;padding:2px"><div style="flex:1"><div style="font-size:20px;font-weight:700">تتبع طلبك</div><small data-brand-title>واحة اليمن</small></div></header>' +
    '<div class="card"><label style="font-size:12px">كود المتابعة</label><div class="row"><input id="tc" dir="ltr" style="flex:1;text-transform:uppercase" placeholder="مثال: 7K2M9QXA" value="' + esc((code0 || '').toUpperCase()) + '"><button class="p" id="tg">تتبّع</button></div></div>' +
    '<div id="tinfo"></div><div id="tmap" class="card" style="height:320px;display:none;padding:0;overflow:hidden"></div>';
  let tmr, mapT, mk, lastTrackPos = null, trackBusy = false;
  async function go() {
    const code = $('tc') ? $('tc').value.trim().toUpperCase() : ''; if (!code) return;
    if (trackBusy || document.visibilityState !== 'visible' || !navigator.onLine) return;
    trackBusy = true;
    let result;
    try { result = await safeRpc('dlv_track', { p_code: code }); }
    catch (e) { result = { error: e }; }
    finally { trackBusy = false; }
    const { data: j, error } = result || {};
    const box = $('tinfo'); if (!box) return clearInterval(tmr);
    if (error) {
      // Transient network/API errors must never terminate the customer's tracking session.
      const warn = $('trackConnectionNotice');
      if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">الاتصال بالخريطة متقطع مؤقتًا؛ سنحاول التحديث تلقائيًا دون إغلاق المتابعة.</div>');
      return;
    }
    if (!j || !j.found) {
      if (j && j.limited) {
        const warn = $('trackConnectionNotice');
        if (!warn) box.insertAdjacentHTML('afterbegin','<div class="msg" id="trackConnectionNotice" style="background:#fff4d6;color:#72521a">ضغط مؤقت على خدمة التتبع؛ سنعيد المحاولة تلقائيًا.</div>');
        return;
      }
      box.innerHTML = '<div class="msg e">' + (j && j.expired ? 'انتهت صلاحية الكود' : 'الكود غير صحيح، راجع الكود مع خدمة العملاء') + '</div>';
      $('tmap').style.display = 'none'; clearInterval(tmr); return;
    }
    const oldNotice = $('trackConnectionNotice'); if (oldNotice) oldNotice.remove();
    const S = ['تم تسجيل طلبك', 'جاري التجهيز في المطبخ', 'جاهز ومع المشرف', 'اتعيّن لك طيار', 'الطيار خرج لك', 'تم التسليم'];
    const idx = j.status === 'delivered' ? 5 : j.status === 'out' ? 4 : j.pilot_name ? 3 : (j.stage === 'kitchen_ready' || j.stage === 'supervisor_received') ? 2 : 1;
    let h = '<div class="card"><b style="font-size:20px">طلب رقم #' + esc(j.order_no) + '</b>';
    if (j.status === 'failed') h += '<div class="msg e" style="margin-top:10px">تعذر توصيل الطلب، هيتواصل معاك فريق الخدمة.</div>';
    else if (j.status === 'cancelled') h += '<div class="msg e" style="margin-top:10px">تم إلغاء الطلب.</div>';
    else h += S.map((t, i) => '<div class="od" style="margin-top:8px;opacity:' + (i <= idx ? 1 : .45) + '"><span>' + (i < idx ? '✓ ' : i === idx ? '● ' : '○ ') + t + '</span>' + (i === 4 && j.out_at ? '<span class="meta">' + tm(j.out_at) + '</span>' : i === 5 && j.delivered_at ? '<span class="meta">' + tm(j.delivered_at) + '</span>' : '') + '</div>').join('');
    if(j.pilot_reassigned) h += '<div class="msg o" style="margin-top:10px">🔁 تم تغيير الطيار المسؤول عن طلبك. بيانات الطيار المعروضة هي البيانات الحالية.</div>';
    h += '</div>';
    if (j.pilot_name && j.status !== 'failed' && j.status !== 'cancelled') {
      const rawPilotPhone = String(j.pilot_phone || '').trim();
      let pilotDigits = rawPilotPhone.replace(/\D/g, '');
      if (pilotDigits.startsWith('0')) pilotDigits = '20' + pilotDigits.slice(1);
      const hasPilotPhone = /^20(?:10|11|12|15)\d{8}$/.test(pilotDigits) || /^\d{10,15}$/.test(pilotDigits) && !pilotDigits.startsWith('0');
      const callAction = hasPilotPhone
        ? '<a href="tel:+' + pilotDigits + '" class="pilot-contact-btn pilot-call" dir="rtl"><span aria-hidden="true">☎</span> اتصال</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">☎ اتصال</button>';
      const waAction = hasPilotPhone
        ? '<a href="https://wa.me/' + pilotDigits + '" target="_blank" rel="noopener noreferrer" class="pilot-contact-btn pilot-wa" dir="rtl"><span aria-hidden="true">◉</span> واتساب</a>'
        : '<button type="button" class="pilot-contact-btn pilot-disabled" disabled title="أضف رقم الطيار من إدارة الحسابات">◉ واتساب</button>';
      h += '<div class="card pilot-contact-card"><div class="meta">الطيار</div><b style="font-size:20px">' + esc(j.pilot_name) + '</b><div class="pilot-contact-actions">' + callAction + waAction + '</div>' + (!hasPilotPhone ? '<div class="meta">أزرار التواصل جاهزة؛ ستعمل بعد إضافة رقم الطيار في إدارة الحسابات.</div>' : '<div class="meta" dir="ltr" style="text-align:right">' + esc(rawPilotPhone) + '</div>') + '</div>';
    }
    box.innerHTML = h;
    const m = $('tmap');
    if (j.lat != null) {
      m.style.display = 'block';
      if (!mapT) { mapT = L.map('tmap').setView([j.lat, j.lng], 15); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapT); mk = L.marker([j.lat, j.lng], { icon: bikeIcon(0, true, 90), keyboard: false }).addTo(mapT); lastTrackPos = {lat:j.lat,lng:j.lng}; }
      else { const nextPos = {lat:j.lat,lng:j.lng}; const bearing = bikeBearing(lastTrackPos, nextPos); animateRiderMarker(mk,j.lat,j.lng,4200); mk.setIcon(bikeIcon(bearing, true, 90)); mapT.panTo([j.lat, j.lng],{animate:true,duration:1}); lastTrackPos = nextPos; }
    } else m.style.display = 'none';
    if (j.status === 'delivered') {
      m.style.display = 'none';
      if (mapT) { mapT.remove(); mapT = null; mk = null; lastTrackPos = null; }
      const already = j.rated === true;
      if (already) {
        box.innerHTML += '<div class="card"><h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييمك بنجاح.</div></div>';
      } else {
        box.innerHTML += `<div class="card" id="ratingCard"><h2>⭐ قيّم تجربتك مع واحة اليمن</h2><div class="meta">يسعدنا نعرف رأيك بعد استلام طلبك.</div>
          <label>تقييم الطيار</label><div class="rateRow" data-rate="delivery">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم المطعم</label><div class="rateRow" data-rate="restaurant">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تقييم موظف متابعة الكول سنتر</label><div class="rateRow" data-rate="callcenter">${[1,2,3,4,5].map(n=>`<button type="button" class="rateStar" data-v="${n}">☆</button>`).join('')}</div>
          <label>تعليقك (اختياري)</label><textarea id="rateComment" maxlength="1000" placeholder="اكتب ملاحظاتك هنا"></textarea>
          <button class="p big" id="sendRating">إرسال التقييم</button><div id="rateMsg" class="meta"></div></div>`;
        const scores={delivery:0,restaurant:0,callcenter:0};
        document.querySelectorAll('.rateRow').forEach(row=>row.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const key=row.dataset.rate;scores[key]=Number(btn.dataset.v);row.querySelectorAll('button').forEach(b=>b.textContent=Number(b.dataset.v)<=scores[key]?'★':'☆');}));
        $('sendRating').onclick=async()=>{if(!scores.delivery||!scores.restaurant||!scores.callcenter){$('rateMsg').textContent='من فضلك قيّم الأقسام الثلاثة';return;}
          $('sendRating').disabled=true;$('rateMsg').textContent='جارٍ إرسال تقييمك...';
          try {
            const {data,error}=await safeRpc('dlv_submit_customer_rating',{p_code:code,p_delivery:scores.delivery,p_restaurant:scores.restaurant,p_callcenter:scores.callcenter,p_comment:$('rateComment').value||null});
            if(error){$('sendRating').disabled=false;$('rateMsg').textContent=error.message;return;}
            if(data?.rate_limited){$('sendRating').disabled=false;$('rateMsg').textContent=data.message||'محاولات كثيرة. حاول مرة أخرى بعد دقيقة';return;}
            if(data?.already_rated){$('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">تم استلام تقييم هذا الطلب من قبل.</div>';return;}
            if(data?.success!==true){$('sendRating').disabled=false;$('rateMsg').textContent=data?.message||'لم نتمكن من حفظ التقييم. حاول مرة أخرى.';return;}
            $('ratingCard').innerHTML='<h2>شكرًا لتقييمك ❤️</h2><div class="meta">وصل تقييمك لصاحب النظام وفريق متابعة الكول سنتر.</div>';
          } catch(e) {
            $('sendRating').disabled=false;
            $('rateMsg').textContent='تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى.';
          }
        };
      }
      clearInterval(tmr);
    }
  }
  $('tg').onclick = () => { clearInterval(tmr); go(); tmr = setInterval(go, 5000); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('tc')) go(); });
  window.addEventListener('online', () => { if ($('tc')) go(); });
  if (code0) $('tg').onclick();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

const _t = new URLSearchParams(location.search).get('t'); (async()=>{if (_t !== null) {document.documentElement.classList.remove('ys-public');await loadBrandConfig();subscribeBrandConfig();trackView(_t);} else boot();})();
</script>
